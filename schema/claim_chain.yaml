id: https://w3id.org/claim-chain/schema
name: claim_chain
title: claim-chain argument-chain schema
description: >-
  Draft schema for encoding the argument chain of a single research paper: typed statements, the evidence offered for each,
  typed relations between statements, scope, and annotator concerns. Each
  paper is encoded on its own; no cross-paper linking or external
  ontologies. Each claim gets a validity verdict ("does the presented data
  support it?"), and the paper gets a logic score. Modelled loosely on the
  Micropublications ontology (Clark et al. 2014, doi:10.1186/2041-1480-5-28).
  v0.4 adds, from Jan's Zhuang 2017 encoding: recomputable checks on
  evidence values, explicit warrants (inference rules), claim roles, the
  authors' own certainty, structured data requests in proof obligations,
  and the reasons why references are cited. All v0.4 additions are
  optional, so v0.3 files stay valid.
  v0.5 adds, from Soroush's approach: five criteria per support link
  (directness, sufficiency, controls, alternatives, scope match), an
  UNSUPPORTED support strength, a WEAK verdict between PARTIAL and
  INCONCLUSIVE, and `essential` links, so that scripts/render.py can derive
  each claim's verdict from its links (weakest-link rule) and compare it with
  the annotator's verdict. It replaces the per-claim criteria draft. All
  v0.5 additions are optional, so v0.4 files stay valid.
  v0.6 adds, from Sepideh's paper logic map: AIM statements (what the paper
  promises to do), DELIVERS and RESTATES relations, so that scripts/render.py
  can follow each aim from the introduction to the conclusion (the golden
  thread) and detect claims that grow more certain at the end; an ARITHMETIC
  concern and a priority on concerns, so that the local checks of each part
  (completeness, arithmetic, consistency) can be counted per part. All v0.6
  additions are optional, so v0.5 files stay valid.
version: 0.6.0
license: CC-BY-4.0
prefixes:
  linkml: https://w3id.org/linkml/
  claimchain: https://w3id.org/claim-chain/schema/
  mp: http://purl.org/mp/
  dcterms: http://purl.org/dc/terms/
  schema: http://schema.org/
  arxiv: https://arxiv.org/abs/
  doi: https://doi.org/
  # Placeholder namespaces for RDF export (not registered). One prefix per encoded paper.
  ent: https://w3id.org/claim-chain/entity/
  wang2026: https://w3id.org/claim-chain/arXiv2606.09611v1/
  zhuang2017: https://w3id.org/claim-chain/doi10.1088-1361-651X-aa7e0c/
  zhang2013: https://w3id.org/claim-chain/doi10.1016-j.commatsci.2013.07.012/
  agarwal2026: https://w3id.org/claim-chain/arXiv2610.26996/
  benmoumen2026: https://w3id.org/claim-chain/arXiv2610.27240/
  toncich2026: https://w3id.org/claim-chain/arXiv2610.27355/
  delmont2026: https://w3id.org/claim-chain/arXiv2610.27460/
  skolakova2026: https://w3id.org/claim-chain/arXiv2610.27825/
  hasan2026: https://w3id.org/claim-chain/arXiv2610.28152/
  boticaartalejo2026: https://w3id.org/claim-chain/arXiv2610.28232/
  starkey2026: https://w3id.org/claim-chain/arXiv2610.28493/
  yin2026: https://w3id.org/claim-chain/arXiv2610.28564/
  liu2026: https://w3id.org/claim-chain/arXiv2610.28629/
default_prefix: claimchain
default_range: string
imports:
  - linkml:types

classes:

  ArgumentChain:
    tree_root: true
    description: The full encoded argument of one publication.
    slots:
      - id
      - publication
      - annotator
      - annotation_date
      - schema_version
      - entities
      - cited_works
      - statements
      - relations
      - paper_assessment

  Publication:
    class_uri: schema:ScholarlyArticle
    slots:
      - id
      - title
      - authors
      - year
      - doi
      - arxiv
      - url

  Statement:
    class_uri: mp:Statement
    description: >-
      One self-contained proposition, phrased so it is understandable on its
      own (no pronouns pointing to other statements).
    slots:
      - id
      - statement_type
      - text
      - section
      - paper_part
      - hedged
      - evidence
      - scope
      - about
      - claim_modality
      - claim_role
      - author_certainty
      - warrant
      - priority
      - assumption_basis
      - open_question
      - limitation_kind
      - assessment
      - concerns
      - note

  Evidence:
    class_uri: mp:Support
    description: What the paper offers in support of a statement.
    slots:
      - evidence_kind
      - locator
      - references
      - description
      - values
      - derived_checks

  QuantitativeValue:
    slots:
      - symbol
      - quantity
      - value
      - unit
      - condition

  Scope:
    description: Conditions under which a statement was shown to hold.
    slots:
      - materials
      - techniques
      - sample_count
      - crystal_structures
      - scope_note

  Relation:
    description: A directed, typed link between two statements.
    slots:
      - id
      - subject
      - predicate
      - object
      - asserted_by
      - support_basis
      - support_strength
      - uncertainty
      - link_criteria
      - essential
      - warrant
      - note

  Assessment:
    description: >-
      Verdict on one claim or hypothesis: does the data presented in the paper
      support it?
    slots:
      - validity
      - rationale
      - criteria
      - missing_evidence
      - proof_obligations

  Criteria:
    deprecated: >-
      Replaced in v0.5 by LinkCriteria on relations. Kept so that the
      reliability-test files of 21 October 2026 stay valid.
    description: >-
      Draft rubric (21 October 2026): six questions answered separately for one
      claim. Each answer is MET, PARTLY, NOT_MET or NOT_APPLICABLE. render.py
      derives a graded score (mean of MET=1, PARTLY=0.5, NOT_MET=0 over the
      applicable criteria) and a suggested verdict, and reports where the
      suggested verdict differs from `validity`.
    slots:
      - grounded
      - scope_matches
      - inference_sound
      - alternatives_excluded
      - quantified
      - consistent
      - criteria_note

  LinkCriteria:
    description: >-
      Five tests of one support link (Soroush's approach). Each answer is MET
      (pass), PARTLY (weak), NOT_MET (fail) or NOT_APPLICABLE. render.py
      derives a support strength from them: all met is STRONG; at most two
      partly and none failed is INTERMEDIATE; one failed or more than two
      partly is WEAK; directness or scope failed, or two or more failed, is
      UNSUPPORTED.
    slots:
      - directness
      - sufficiency
      - controls
      - alternatives
      - scope_match
      - criteria_note

  ProofObligation:
    description: >-
      Something that has to be shown for a claim to hold (reviewer's view).
      Open obligations are what a reviewer would ask for.
    slots:
      - text
      - obligation_status
      - discharged_by
      - priority
      - requested_data

  PaperAssessment:
    description: >-
      Paper-level result with the three outputs: logic (verdict and score),
      limitations, and missing evidence.
    slots:
      - overall_validity
      - logic_score
      - weighted_logic_score
      - obligation_coverage
      - score_method
      - summary
      - key_limitations
      - missing_evidence

  Entity:
    description: >-
      A thing statements are about (material, technique, quantity, method,
      concept), defined once per paper so statements and scopes can refer to it.
    slots:
      - id
      - label
      - entity_type
      - description

  DerivedCheck:
    description: >-
      A number or criterion computed from the evidence values, so that a
      claim can be checked by recomputing instead of by reading. If `formula`
      is given, scripts/render.py evaluates it from the `symbol`s of the
      evidence values and compares the outcome with `result` or `satisfied`.
    slots:
      - expression
      - formula
      - result
      - unit
      - satisfied
      - note

  Warrant:
    description: >-
      The inference rule that licenses a step: why the evidence (or the
      subject statement) implies the claim, e.g. "Born criteria satisfied
      implies mechanical stability". A multi-step inference is encoded as
      intermediate statements, each step with its own warrant.
    slots:
      - rule
      - warrant_basis
      - references
      - support_strength

  CitedWork:
    description: >-
      A reference of the paper and why the argument cites it. References are
      not looked up; `cited_for` records what the reference is assumed to
      provide.
    slots:
      - id
      - number
      - citation
      - cited_for

  RequestedData:
    description: A measurement or calculation that would discharge a proof obligation.
    slots:
      - quantity
      - unit
      - method

  Concern:
    description: An annotator's (not the authors') remark on a logical weakness.
    slots:
      - concern_type
      - description
      - priority

slots:
  id:
    identifier: true
    range: uriorcurie
  publication:
    range: Publication
    inlined: true
    required: true
  annotator:
  annotation_date:
    range: date
  schema_version:
  entities:
    range: Entity
    multivalued: true
    inlined_as_list: true
  statements:
    range: Statement
    multivalued: true
    inlined_as_list: true
  relations:
    range: Relation
    multivalued: true
    inlined_as_list: true
  title:
    slot_uri: dcterms:title
  authors:
    multivalued: true
    slot_uri: dcterms:creator
  year:
    range: integer
  doi:
  arxiv:
  url:
    range: uri
  statement_type:
    range: StatementType
    required: true
  text:
    required: true
  section:
    description: Location in the paper, e.g. "Sec. 4.2".
  hedged:
    range: boolean
    description: True if the authors themselves hedge ("likely", "we expect").
  evidence:
    range: Evidence
    multivalued: true
    inlined_as_list: true
  scope:
    range: Scope
    inlined: true
  about:
    range: Entity
    multivalued: true
    description: Entities this statement is about.
  concerns:
    range: Concern
    multivalued: true
    inlined_as_list: true
  note:
  evidence_kind:
    range: EvidenceKind
    required: true
  locator:
    description: Figure, table, equation or section, e.g. "Fig. 5a".
  references:
    multivalued: true
    description: Reference numbers or DOIs cited as evidence.
  description:
  values:
    range: QuantitativeValue
    multivalued: true
    inlined_as_list: true
  quantity:
    required: true
  value:
    range: float
    required: true
  unit:
  condition:
  materials:
    range: Entity
    multivalued: true
  techniques:
    range: Entity
    multivalued: true
  sample_count:
    range: integer
    description: Number of independent samples or datasets.
  crystal_structures:
    multivalued: true
  scope_note:
  subject:
    range: uriorcurie
    required: true
    description: Id of a Statement (or, for ANALOG_OF, an Entity).
  predicate:
    range: RelationType
    required: true
  object:
    range: uriorcurie
    required: true
    description: Id of a Statement (or, for ANALOG_OF, an Entity).
  asserted_by:
    range: AssertionSource
    required: true
  label:
    required: true
  entity_type:
    range: EntityType
  concern_type:
    range: ConcernType
    required: true
  claim_modality:
    range: ClaimModality
    description: What kind of statement a claim or observation makes, e.g. correlational vs. causal.
  assumption_basis:
    range: AssumptionBasis
    description: For ASSUMPTION statements, where the premise comes from.
  open_question:
    description: For ASSUMPTION statements, what remains open if the premise is questioned.
  limitation_kind:
    range: LimitationKind
  assessment:
    range: Assessment
    inlined: true
    description: Validity verdict; expected for every CLAIM and HYPOTHESIS.
  validity:
    range: Validity
    required: true
  rationale:
    required: true
  missing_evidence:
    multivalued: true
    description: Data or analysis that would be needed to support the statement.
  paper_assessment:
    range: PaperAssessment
    inlined: true
  overall_validity:
    range: Validity
  logic_score:
    range: float
    minimum_value: 0
    maximum_value: 1
    description: Computed by scripts/render.py from the claim verdicts; see score_method.
  score_method:
  summary:
  key_limitations:
    multivalued: true
  support_basis:
    range: SupportBasis
    description: How the subject supports the object (qualitative, quantitative, logical).
  paper_part:
    range: PaperPart
    description: Part of the paper the statement comes from; lets extraction run part by part.
  support_strength:
    range: SupportStrength
    description: How strongly the subject supports the object.
  proof_obligations:
    range: ProofObligation
    multivalued: true
    inlined_as_list: true
  obligation_status:
    range: ObligationStatus
    required: true
  discharged_by:
    range: uriorcurie
    multivalued: true
    description: Ids of statements that (partly) discharge the obligation.
  uncertainty:
    range: Uncertainty
    description: Qualitative uncertainty of the link itself.
  criteria:
    range: Criteria
    inlined: true
    deprecated: Use link_criteria on relations (v0.5).
  grounded:
    range: CriterionValue
    description: The claim rests on data, a derivation or citations that the paper presents, not on assertion alone.
  scope_matches:
    range: CriterionValue
    description: The evidence covers the claim as worded (materials, conditions, number of samples, generality, "optimal", "any").
  inference_sound:
    range: CriterionValue
    description: The step from evidence to claim uses an established rule or one argued in the paper; empirical rules of thumb or unstated rules give PARTLY or NOT_MET.
  alternatives_excluded:
    range: CriterionValue
    description: Obvious alternative explanations or confounders are excluded by a control or an argument. NOT_APPLICABLE for purely descriptive claims.
  quantified:
    range: CriterionValue
    description: Quantitative or comparative claims come with numbers, uncertainties or sample counts that make the difference meaningful. NOT_APPLICABLE for qualitative claims.
  consistent:
    range: CriterionValue
    description: Nothing in the paper's own data or statements contradicts the claim.
  link_criteria:
    range: LinkCriteria
    inlined: true
    description: The five tests of a SUPPORTS or CONDITIONALLY_SUPPORTS link.
  essential:
    range: boolean
    description: >-
      The object cannot hold without this link. A claim is no stronger than
      its weakest essential link, and no stronger than the claim an essential
      link comes from (weakest-link rule).
  directness:
    range: CriterionValue
    description: The evidence measures the claimed quantity itself, not a proxy.
  sufficiency:
    range: CriterionValue
    description: Enough samples, repeats, statistics and error analysis to carry the claim.
  controls:
    range: CriterionValue
    description: Confounders are controlled and a fair baseline is compared.
  alternatives:
    range: CriterionValue
    description: Other plausible explanations are excluded by a control or an argument.
  scope_match:
    range: CriterionValue
    description: The claim stays within the conditions actually tested (materials, range, data set, sample size).
  criteria_note:
  claim_role:
    range: ClaimRole
    description: Role of a claim or hypothesis in the paper's argument; used to weight the logic score.
  author_certainty:
    range: AuthorCertainty
    description: >-
      How certain the authors themselves present the statement. This is the
      authors' stance; the annotator's verdict goes in `assessment`.
  warrant:
    range: Warrant
    inlined: true
    description: >-
      On a Relation: why the subject supports the object. On a Statement: why
      the statement's own evidence supports it.
  priority:
    range: Priority
    description: How much the argument depends on an open question, obligation or concern.
  cited_works:
    range: CitedWork
    multivalued: true
    inlined_as_list: true
  number:
    description: The reference's number or label in the paper's bibliography.
  citation:
    description: Short bibliographic string, e.g. "Mouhat & Coudert, PRB 90, 224104 (2014)".
  cited_for:
    multivalued: true
    description: What the argument assumes the reference provides, e.g. "Born stability criteria".
  derived_checks:
    range: DerivedCheck
    multivalued: true
    inlined_as_list: true
  symbol:
    description: >-
      Short identifier for the value, usable in DerivedCheck formulas (e.g.
      C11, BG_Mg). Letters, digits and underscores; unique within one Evidence.
    pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
  expression:
    required: true
    description: Human-readable form of the check, e.g. "2 C13^2 < C33 (C11 + C12)".
  formula:
    description: >-
      Machine-evaluable arithmetic over the value symbols, Python syntax
      (+ - * / ** abs min max, comparisons), e.g. "2*C13**2 < C33*(C11+C12)".
  result:
    range: float
    description: Reported numeric outcome of the formula.
  satisfied:
    range: boolean
    description: Reported outcome of a criterion (a formula with a comparison).
  rule:
    required: true
  warrant_basis:
    range: WarrantBasis
  requested_data:
    range: RequestedData
    multivalued: true
    inlined_as_list: true
  method:
  weighted_logic_score:
    range: float
    minimum_value: 0
    maximum_value: 1
    description: Logic score weighted by claim_role; computed by scripts/render.py.
  obligation_coverage:
    range: float
    minimum_value: 0
    maximum_value: 1
    description: Share of proof obligations discharged (PARTIALLY_DISCHARGED counts half).

enums:

  StatementType:
    permissible_values:
      BACKGROUND:
        description: Established fact taken from the literature.
      GAP:
        description: Problem or gap the work addresses.
      HYPOTHESIS:
        description: Proposition the paper sets out to establish (the central thesis or a sub-hypothesis).
      AIM:
        description: >-
          What the paper promises to do or deliver ("In this work we ..."), and
          the payoff it promises. Usually in the introduction; many papers state
          aims rather than a hypothesis. Followed to the conclusion through
          DELIVERS links (the golden thread).
      QUESTION:
        description: Research or bridging question.
      DEFINITION:
        description: New term or concept introduced.
      ASSUMPTION:
        description: >-
          Premise the argument relies on but does not test in this paper. Either a
          general claim accepted in the community, or a choice made by the
          authors (see assumption_basis). Questioning it opens an open question.
      METHOD:
        description: Methodological choice or procedure.
      DATA:
        description: Description of datasets or samples used.
      OBSERVATION:
        description: Result read from this paper's own data.
      CLAIM:
        meaning: mp:Claim
        description: Conclusion drawn by the authors.
      LIMITATION:
        description: Limitation or inconsistency acknowledged by the authors (see limitation_kind).
      OUTLOOK:
        description: Speculation or future work.

  EvidenceKind:
    permissible_values:
      CITATION:
        description: Supported by reference to prior work.
      ARGUMENT:
        description: Supported by reasoning only.
      DATA_QUALITATIVE:
        description: Supported by data judged by eye (maps, plots).
      DATA_QUANTITATIVE:
        description: Supported by numbers or statistics.
      NONE:
        description: No support given (including "preliminary tests" not shown).

  RelationType:
    permissible_values:
      SUPPORTS:
        meaning: mp:supports
      WEAKENS:
        meaning: mp:challenges
        description: >-
          Counter-evidence: lowers the credibility of the object without
          contradicting it. Called UNDERCUTS before; an undercutter in the
          argumentation sense attacks the inference itself and needs
          addressable inferences, which the schema does not have yet.
      CONTRADICTS:
        meaning: mp:challenges
      QUALIFIES:
        description: Restricts the scope or strength of the object.
      ALTERNATIVE_EXPLANATION_FOR:
        description: Offers another cause for an observation or claim.
      MOTIVATES:
      ANSWERS:
      DEPENDS_ON:
        description: The subject uses the object (e.g. a method uses a definition).
      ANALOG_OF:
        description: The subject is defined by analogy to the object.
      DELIVERS:
        description: >-
          The subject (method, observation or claim) carries out or delivers the
          object, an AIM (or a GAP the paper says it closes).
      RESTATES:
        description: >-
          The subject restates the object later in the paper, e.g. a conclusion
          sentence restating a discussion claim. render.py compares their
          author_certainty to find claims that grow more (or less) certain.
      CONDITIONALLY_SUPPORTS:
        description: >-
          Would support the object if the subject were shown; used for
          untested hypotheses the argument leans on.

  AssertionSource:
    permissible_values:
      AUTHORS:
        description: The link is stated or implied in the paper.
      ANNOTATOR:
        description: The link was added by the annotator from the paper's own content; the paper does not make it.
      ANNOTATOR_BACKGROUND:
        description: The link was added by the annotator (human or LLM) using domain knowledge outside the paper.

  EntityType:
    permissible_values:
      MATERIAL:
      PROCESSING_STATE:
      TECHNIQUE:
      DATA_TYPE:
      QUANTITY:
      METHOD:
      CONCEPT:

  ConcernType:
    permissible_values:
      UNTESTED_ASSERTION:
        description: Claimed as shown, but supported only by argument.
      OVERCLAIM:
        description: Wording stronger than evidence.
      UNFALSIFIABLE_VALIDATION:
        description: Validation design where no outcome counts against the claim.
      CONFOUNDED_COMPARISON:
      AD_HOC_PARAMETER:
      MISSING_QUANTIFICATION:
      OVERGENERALIZATION:
        description: Claim exceeds the scope of the data.
      UNACKNOWLEDGED_CONFLICT:
        description: Conflicts with another statement in the same paper, and the paper does not say so.
      UNADDRESSED_COUNTEREVIDENCE:
      INTERNAL_INCONSISTENCY:
        description: Notation, numbering or terminology mismatch, or text that disagrees with the paper's own tables (consistency check).
      REPRODUCIBILITY:
        description: A detail needed to reproduce or judge this part is not reported (completeness check).
      ARITHMETIC:
        description: A stated number cannot be derived from the paper's own description or values (arithmetic check).
      CAUSAL_OVERREACH:
        description: Causal or mechanistic claim supported only by correlational or visual evidence.

  ClaimModality:
    permissible_values:
      DESCRIPTIVE:
        description: States what something is or what was seen.
      COMPARATIVE:
        description: States that A agrees with, or is better or worse than, B.
      CORRELATIONAL:
        description: States that two quantities go together.
      CAUSAL:
        description: States that A causes or explains B (including mechanisms).
      GENERALIZATION:
        description: Extends a result beyond the tested cases.
      CONCEPTUAL:
        description: Definitional or framing claim; not testable by data alone.

  AssumptionBasis:
    permissible_values:
      COMMUNITY_ACCEPTED:
        description: General claim accepted in the community (may be cited).
      AUTHOR_CHOICE:
        description: Choice or premise introduced by the authors.

  LimitationKind:
    permissible_values:
      SCOPE:
      METHOD:
      DATA:
      INTERPRETATION:
      INCONSISTENCY:
        description: Inconsistency within the paper or with the background literature.

  Validity:
    description: Does the data presented in the paper support the statement?
    permissible_values:
      "YES":
        description: The presented data supports the statement.
      PARTIAL:
        description: Part of the statement is supported, part is not.
      WEAK:
        description: >-
          Only weak support: indirect, thin or uncontrolled evidence (only
          WEAK links).
      INCONCLUSIVE:
        description: The paper presents no data that decides the statement either way.
      "NO":
        description: The presented data, or the paper's own statements, contradict it.

  SupportBasis:
    permissible_values:
      QUALITATIVE:
        description: Visual or descriptive support.
      QUANTITATIVE:
        description: Numerical support.
      LOGICAL:
        description: Support by inference or definition.

  Uncertainty:
    permissible_values:
      LOW:
      MEDIUM:
      HIGH:

  PaperPart:
    permissible_values:
      ABSTRACT:
      INTRODUCTION:
      THEORY:
        description: Concept, theory or model section before the methods.
      METHODS:
      RESULTS:
      DISCUSSION:
      CONCLUSION:
      SUPPLEMENTARY:

  SupportStrength:
    permissible_values:
      STRONG:
        description: The evidence directly measures the claim, with adequate statistics and controls.
      INTERMEDIATE:
        description: Relevant evidence, but one or two criteria are weak (Soroush's MODERATE).
      WEAK:
        description: Indirect, thin or uncontrolled evidence.
      UNSUPPORTED:
        description: The link does not carry the object at all (wrong quantity, wrong scope, no control).

  ClaimRole:
    permissible_values:
      MAIN_CONCLUSION:
        description: A conclusion the paper is about (abstract or conclusions level).
      INTERMEDIATE:
        description: A step on the way to a main conclusion.
      QUANTITATIVE_SUPPORT:
        description: A numerical result offered as support for another claim.
      MECHANISTIC_INTERPRETATION:
        description: An explanation of why a result occurs.
      METHODOLOGICAL:
        description: A claim about the method itself (it works, it finds X).
      COUNTER_CLAIM:
        description: >-
          A claim in the paper that challenges one of its own conclusions.
          Not counted in the logic score; it enters through relations.

  AuthorCertainty:
    permissible_values:
      DEMONSTRATED:
        description: Presented as shown by the paper's own data.
      PREDICTED:
        description: Presented as a prediction from calculation or modelling.
      PROPOSED:
        description: Presented as likely or suggested ("indicates", "suggests").
      SPECULATIVE:
        description: Presented as speculation ("may", "could").

  WarrantBasis:
    permissible_values:
      CITATION:
        description: The rule is established in cited work (assumed correct).
      DEFINITION:
        description: The rule follows from a definition or mathematics.
      EMPIRICAL_CORRELATION:
