  - {id: ent:Powder, label: ultrasonically atomized powder (<63 um), entity_type: PROCESSING_STATE}
  - {id: ent:SPS, label: spark plasma sintering (850-1100 C; 100 MPa; 500 C/min), entity_type: METHOD}
