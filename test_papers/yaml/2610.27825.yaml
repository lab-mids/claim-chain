publication:
  id: arxiv:2610.27825
  title: "Early-stage local melting during solid-state sintering of a Cu-Ni-Ti-Zr-Hf alloy: A combined thermodynamic and kinetic analysis"
  authors: [Andrea Školáková, Hana Lesáková, František Lukáč, Markéta Jarošová, Jan Pinc]
  year: 2026
  arxiv: "2610.27825"
  url: https://arxiv.org/abs/2610.27825

entities:
  - {id: ent:CCA, label: Cu15Ni35Ti25Zr12.5Hf12.5 (at.%) complex concentrated alloy, entity_type: MATERIAL}
