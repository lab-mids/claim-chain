  - {id: ent:CuCrTa, label: Cu-Cr-Ta combinatorial thick film (Cu 81-93; Cr 4-10; Ta 2-11 at.%), entity_type: MATERIAL}
  - {id: ent:Spot11, label: Cu-4.8Cr-2.2Ta (at.%) candidate, entity_type: MATERIAL}
