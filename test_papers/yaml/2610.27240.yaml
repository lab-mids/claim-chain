publication:
  id: arxiv:2610.27240
  title: "Nanoscale chemical engineering of Ti3C2Tx MXene multilayers through in situ electron beam irradiation in a TEM"
  authors: [Ayoub Benmoumen, Marie-Laure David, Noé Condé, Eric Gautron, Sophie Morisset, Stéphane Célérier, Anupma Thakur, Babak Anasori, Vincent Mauchamp, Philippe Moreau]
  year: 2026
  arxiv: "2610.27240"
  url: https://arxiv.org/abs/2610.27240

entities:
  - {id: ent:Ti3C2Tx, label: Ti3C2Tx MXene multilayer, entity_type: MATERIAL}
  - {id: ent:Ti3CNTx, label: Ti3CyNzTx carbonitride MXene, entity_type: MATERIAL}
  - {id: ent:Ti3AlC2, label: Ti3AlC2 MAX phase precursor, entity_type: MATERIAL}
  - {id: ent:Nimpurity, label: nitrogen impurity (~1-2 at%), entity_type: MATERIAL}
  - {id: ent:STEM, label: aberration-corrected scanning transmission electron microscopy, entity_type: TECHNIQUE}
  - {id: ent:ADF, label: annular dark-field imaging, entity_type: TECHNIQUE}
  - {id: ent:EELS, label: electron energy-loss spectroscopy (spectrum imaging), entity_type: TECHNIQUE}
  - {id: ent:FourDSTEM, label: 4D-STEM nanodiffraction, entity_type: TECHNIQUE}
  - {id: ent:XPS, label: X-ray photoelectron spectroscopy, entity_type: TECHNIQUE}
