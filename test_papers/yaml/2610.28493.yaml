entities:
  - {id: ent:aZr, label: alpha-Zr (hcp) substrate, entity_type: MATERIAL}
  - {id: ent:hZrO, label: hexagonal ZrO, entity_type: MATERIAL}
  - {id: ent:mZrO2, label: monoclinic ZrO2, entity_type: MATERIAL}
  - {id: ent:tZrO2, label: tetragonal ZrO2, entity_type: MATERIAL}
  - {id: ent:DFT, label: "DFT (VASP, PBE, PAW)", entity_type: METHOD}
  - {id: ent:SNAP, label: quadratic SNAP machine-learned potential, entity_type: METHOD}
  - {id: ent:KMC, label: kinetic Monte Carlo with DFT-NEB barriers, entity_type: METHOD}
  - {id: ent:PF, label: grand-potential multiphase phase field model (MedeA PhaseField), entity_type: METHOD}
