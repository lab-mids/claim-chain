paper_assessment:
  overall_validity: "YES"
  summary: >-
    A carefully argued method paper. Numerical agreement with GSAS-II is
    benchmarked broadly, speed claims are measured and qualified by
    workload, and each application is tested on held-out patterns, cycles,
    reflections or temperatures. The authors explicitly separate stability
    from accuracy and state what each shared model assumes. Residual
    weaknesses are minor: the spline order sits at the edge of the tested
    range, the Ca3Ti2O7 reconstruction is confined to an external
    displacement basis and validated on one non-monotonic intensity ratio,
    and reference trajectories for Li2S are themselves analysis products.
  key_limitations:
    - "Shared-model results depend on the imposed smoothness or basis; variability reduction is not reduced uncertainty (ASM1, LIM1)."
    - "Ca3Ti2O7 motions limited to a neutron-derived three-vector basis from another sample (ASM2, CLAIM5)."
    - "Spline coefficient number chosen at the upper end of the tested range (METH3)."
    - "Constant-wavelength X-ray only; fixed reflection list and space group (LIM2)."
  missing_evidence:
    - "Bias of joint trajectories relative to full-count references, reported numerically."
    - "Held-out validation of Ca3Ti2O7 on further reflection intensities."
    - "Spline orders beyond 12 coefficients to confirm convergence."
