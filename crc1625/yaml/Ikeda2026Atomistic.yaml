publication:
  id: doi:10.1007/s10853-026-13520-2
  title: "Atomistic simulations of high-entropy alloys: from density functional theory to machine-learning interatomic potentials"
  authors: [Yuji Ikeda, Xiang Xu, Pranav Kumar, Jörg Neugebauer, Li-Fang Zhu, Xi Zhang, Fritz Körmann, Blazej Grabowski]
  year: 2026
  doi: 10.1007/s10853-026-13520-2
  url: https://doi.org/10.1007/s10853-026-13520-2

entities:
  - {id: ent:HEA, label: "high-entropy / compositionally complex alloys", entity_type: MATERIAL}
  - {id: ent:DFT, label: "density functional theory calculations (O(N^3), few hundred atoms, tens of ps MD)", entity_type: METHOD}
  - {id: ent:MLIP, label: "system-specific machine-learning interatomic potentials (MTP, ACE/GRACE, GAP, NNP, MACE, ...)", entity_type: METHOD}
  - {id: ent:uMLIP, label: "universal / foundation MLIPs trained on large datasets (MPtrj, OMat24, SMAX, ...)", entity_type: METHOD}
