statements:

  # ---------------- Introduction ----------------
  - id: ikeda2026:BG1
    statement_type: BACKGROUND
    section: Introduction
    paper_part: INTRODUCTION
    text: DFT has elucidated thermodynamic, mechanical, magnetic and defect properties of HEAs, but its cubic scaling limits cells to a few hundred atoms and MD to tens of picoseconds, too little for the configurational sampling and extended defects HEAs require.
    evidence: [{evidence_kind: CITATION, references: ["30-36"]}]
  - id: ikeda2026:BG2
    statement_type: BACKGROUND
    section: Introduction
    paper_part: INTRODUCTION
    text: Data-driven approaches for HEAs suffer from small, heterogeneous experimental and DFT datasets; MLIPs trained on DFT reproduce energies and forces while being orders of magnitude faster, reaching 10^6-10^8 atoms and nanoseconds.
    evidence: [{evidence_kind: CITATION, references: ["37-63"]}]
  - id: ikeda2026:AIM1
    statement_type: AIM
    section: Abstract, Introduction
    paper_part: INTRODUCTION
    text: Review recent advances in atomistic simulation of HEAs with emphasis on MLIPs - formalisms and training data, chemical SRO, vibrational Gibbs energies, point defects and diffusion, extended defects, hydrogen storage and universal MLIPs - and identify open challenges.
    author_certainty: DEMONSTRATED
  - id: ikeda2026:METH1
    statement_type: METHOD
    section: Introduction, Tables 1-2
    paper_part: METHODS
    text: Narrative review organised by property class, with a table of related reviews (with the authors' qualitative coverage assessment) and a table of HEA MLIP studies; no systematic search protocol or inclusion criteria are stated.
    about: [ent:MLIP]
    concerns:
      - {concern_type: REPRODUCIBILITY, description: "No literature-search strategy or inclusion criteria are given, and many highlighted studies come from the authors' own groups (e.g. direct upsampling, GRACE/SMAX), so coverage and emphasis may be selective.", priority: LOW}

  # ---------------- Reviewed evidence ----------------
  - id: ikeda2026:OBS1
    statement_type: OBSERVATION
    section: MLIP formalisms and training datasets
    paper_part: RESULTS
    text: Chemical embedding and low-rank tensor representations avoid combinatorial parameter growth with the number of species, and active learning (e.g. D-optimality/MaxVol, Bayesian uncertainty) samples chemical, thermal and defect configurations with limited DFT cost.
    evidence: [{evidence_kind: CITATION, references: ["Table 2"]}]
    about: [ent:MLIP]
  - id: ikeda2026:OBS2
    statement_type: OBSERVATION
    section: Chemical short-range order
    paper_part: RESULTS
    text: MLIP studies show that local relaxation and magnetism in the DFT training data change predicted SRO, that Warren-Cowley pair parameters miss energetically relevant higher-order motifs, and that processing can create non-equilibrium SRO states.
    evidence: [{evidence_kind: CITATION, references: ["85", "91", "214"]}]
    about: [ent:SRO]
  - id: ikeda2026:OBS3
    statement_type: OBSERVATION
    section: Gibbs energies beyond configurational contributions
    paper_part: RESULTS
    text: MLIP-based thermodynamic integration and direct upsampling reproduce DFT Helmholtz energies within about 1-1.5 meV/atom for VNbMoTaW and VCrTaW, and including anharmonic vibrations reduces the error in the VCoNi order-disorder temperature by about one third.
    evidence: [{evidence_kind: CITATION, references: ["74", "79", "96"]}]
    about: [ent:Upsampling]
  - id: ikeda2026:OBS4
    statement_type: OBSERVATION
    section: Point defects and diffusion; Extended defects
    paper_part: RESULTS
    text: Point-defect formation and migration energies in HEAs show broad distributions requiring Widom-type or effective Gibbs-energy treatments, and hybrid MC/MD with MLIPs shows SRO affecting stacking-fault and grain-boundary energies and dislocation motion.
    evidence: [{evidence_kind: CITATION, references: ["210-216"]}]
    about: [ent:MLIP, ent:SRO]
  - id: ikeda2026:OBS5
    statement_type: OBSERVATION
    section: From system-specific MLIPs to foundation models
    paper_part: RESULTS
    text: Benchmarks show some universal MLIPs reaching the accuracy of a system-specific W potential, formation-energy errors below ~10 meV/atom for binary phase diagrams, and SMAX-trained GRACE models describing distorted configurations; universal MLIPs still often need fine-tuning and are costlier at inference than system-specific ones.
    evidence: [{evidence_kind: CITATION, references: ["288", "310", "313", "314", "318"]}]
    about: [ent:uMLIP]
  - id: ikeda2026:OBS6
    statement_type: OBSERVATION
    section: Hydrogen storage HEAs
    paper_part: RESULTS
    text: MLIP studies of hydrogen in HEAs are still scarce; the case for MLIPs rests on DFT studies of hydrogen-storage HEAs and MLIP studies of ordered hydrogen-storage alloys.
    evidence: [{evidence_kind: CITATION, references: ["275", "279"]}]

  # ---------------- Claims ----------------
  - id: ikeda2026:CLAIM1
    statement_type: CLAIM
    claim_role: MAIN_CONCLUSION
    section: Abstract, Conclusions
    paper_part: DISCUSSION
    text: MLIPs enable statistically robust HEA simulations with near-DFT accuracy at greatly reduced cost, allowing explicit treatment of SRO, vibrational Gibbs energies, point defects, diffusion, dislocations and grain boundaries.
    about: [ent:MLIP]
    claim_modality: DESCRIPTIVE
    author_certainty: DEMONSTRATED
    assessment:
      validity: "YES"
      rationale: "Backed by the cited body of HEA MLIP studies (Table 2) with quantitative DFT-agreement examples (1-1.5 meV/atom); qualified in the text itself as 'for targeted applications'."
  - id: ikeda2026:CLAIM2
    statement_type: CLAIM
    claim_role: INTERMEDIATE
    section: Chemical SRO; Conclusions
    paper_part: DISCUSSION
    text: Pair-correlation descriptors such as Warren-Cowley parameters are insufficient to resolve the energetics of local chemical environments; higher-order motifs coupled to lattice distortions must be characterised for predictive HEA design.
    about: [ent:SRO]
    claim_modality: DESCRIPTIVE
    author_certainty: DEMONSTRATED
    assessment:
      validity: PARTIAL
      rationale: "Supported for the cited cases (SRO motifs, vacancy formation energies); generalisation to 'predictive design' of HEAs in general goes beyond two examples."
  - id: ikeda2026:CLAIM3
    statement_type: CLAIM
    claim_role: MAIN_CONCLUSION
    section: Conclusions
    paper_part: DISCUSSION
    text: Universal MLIPs open rapid, transferable exploration of HEA compositional space and have begun to substantially reduce the cost of generating DFT training data.
    about: [ent:uMLIP]
    claim_modality: GENERALIZATION
    author_certainty: PREDICTED
    assessment:
      validity: PARTIAL
      rationale: "Promising benchmarks are cited, but the review itself notes that universal MLIPs often need fine-tuning, are slower at inference, and that HEA applications are still few; 'transferable' is supported mainly by SMAX-trained GRACE results from the authors' institutional network."
  - id: ikeda2026:CLAIM4
    statement_type: CLAIM
    claim_role: INTERMEDIATE
    section: Hydrogen storage; Conclusions
    paper_part: DISCUSSION
    text: Functional applications such as hydrogen-storage HEAs are expected to benefit greatly from MLIP-based simulations.
    claim_modality: GENERALIZATION
    author_certainty: PREDICTED
    assessment:
      validity: INCONCLUSIVE
      rationale: "Outlook: MLIP studies of hydrogen-storage HEAs are acknowledged to be scarce, so the benefit is extrapolated from DFT and ordered-alloy MLIP work."
  - id: ikeda2026:CONC1
    statement_type: CLAIM
    claim_role: MAIN_CONCLUSION
    section: Abstract, Conclusions
    paper_part: CONCLUSION
    text: MLIPs are fundamentally shifting HEA modelling from conventional DFT toward statistically rigorous sampling and predictive exploration of chemically complex materials, a paradigm shift essential to unlock HEAs' potential.
    author_certainty: DEMONSTRATED
    assessment:
      validity: PARTIAL
      rationale: "The methodological shift is well documented; 'predictive' and 'essential' are forward-looking, and the open challenges listed (magnetism, charge, electronic excitations, defect transferability, training-set construction) show the predictive framework is not yet in place."
  - id: ikeda2026:LIM1
    statement_type: LIMITATION
    section: Abstract, Conclusions
    paper_part: DISCUSSION
    text: Open challenges are transferability to highly distorted defect configurations, treatment of magnetic and charge degrees of freedom and electronic excitations, configurational sampling beyond ideal mixing in free-energy methods, and representative training datasets.
    limitation_kind: SCOPE
  - id: ikeda2026:OUT1
    statement_type: OUTLOOK
    section: Conclusions
    paper_part: CONCLUSION
    text: Develop magnetic and electronic-temperature-aware MLIPs, defect-mimicking small cells for training, knowledge distillation of foundation models, and couple MLIP results to multiscale and data-driven frameworks for HEA design.

