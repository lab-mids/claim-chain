paper_assessment:
  overall_validity: PARTIAL
  summary: >-
    A comprehensive review of how EDL parameters are measured and computed
    and how electrode composition, structure and electrolyte affect them.
    It is candid about the method dependence of Cdl, the early stage of
    SECCM-based pzc determination and theory-experiment discrepancies, and
    its methodological recommendations follow directly from the reviewed
    evidence. Links between EDL parameters and electrocatalytic activity
    are presented as emerging correlations from few systems, such as an HEA
    pzc-work function trend over a 0.14 eV range of estimated work
    functions. This encoding covers selected sections only.
  key_limitations:
    - "Activity correlations of pzc/PME from few systems (CLAIM1, CLAIM2)."
    - "HEA work functions estimated, narrow range (OBS3)."
    - "Cdl literature values not comparable across normalization and method (LIM1)."
    - "Encoding based on selected sections of a 72-page review."
  missing_evidence:
    - "Systematic dataset of Cdl, pzc and PME measured under identical conditions together with activity."
    - "Single-crystal HEA studies with measured work functions."
