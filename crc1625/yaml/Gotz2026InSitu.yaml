entities:
  - {id: ent:Ptpc, label: "eroded polycrystalline Pt wire (0.2 mm) in 0.1 M HClO4 in an EPR capillary with Pt quasi-reference", entity_type: MATERIAL}
  - {id: ent:EPR, label: "in situ CW X-band EC-EPR at 43-46 °C with potentiostatic holds", entity_type: TECHNIQUE}
  - {id: ent:Sim, label: "EasySpin simulations of 195Pt hyperfine patterns for Pt-H, Pt2-H, Pt3-H", entity_type: METHOD}
  - {id: ent:AIMD, label: "revPBE-D3 AIMD of Pt(111) with 7/12 ML H and 64 water molecules; laterally resolved free energy surface", entity_type: METHOD}
