publication:
  id: doi:10.1021/jacs.4c10086
  title: "Revealing the Reaction Pathway of Anodic Hydrogen Evolution at Magnesium Surfaces in Aqueous Electrolytes"
  authors: [Florian Deißenbeck, Sudarsan Surendralal, Mira Todorova, Stefan Wippermann, Jörg Neugebauer]
  year: 2024
  doi: 10.1021/jacs.4c10086
  url: https://doi.org/10.1021/jacs.4c10086

