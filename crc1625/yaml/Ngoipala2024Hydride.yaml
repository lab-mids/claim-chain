publication:
  id: doi:10.1002/adma.202410951
  title: "Hydride-Induced Reconstruction of Pd Electrode Surfaces: A Combined Computational and Experimental Study"
  authors: [Apinya Ngoipala, Christian Schott, Valentin Briega-Martos, Minaam Qamar, Matous Mrovec, Sousa Javan Nikkhah, Thorsten O. Schmidt, Lewin Deville, Andrea Capogrosso, Lilian Moumaneix, Tanja Kallio, Arnaud Viola, Frédéric Maillard, Ralf Drautz, Aliaksandr S. Bandarenka, Serhiy Cherevko, Matthias Vandichel, Elena L. Gubanova]
  year: 2025
  doi: 10.1002/adma.202410951
  url: https://doi.org/10.1002/adma.202410951

entities:
  - {id: ent:Pd, label: "Pd(111), Pd(110), Pd(100) single crystals in 0.1 M HClO4", entity_type: MATERIAL}
  - {id: ent:PdNP, label: 4 nm and 14 nm Pd/C nanoparticles, entity_type: MATERIAL}
  - {id: ent:ECSTM, label: electrochemical scanning tunnelling microscopy, entity_type: TECHNIQUE}
  - {id: ent:SFCICPMS, label: online scanning flow cell ICP-MS dissolution, entity_type: TECHNIQUE}
  - {id: ent:MD, label: "large-scale MD with ACE (PBE-D3) Pd-H potential, 8 ns at 300 K", entity_type: METHOD}
