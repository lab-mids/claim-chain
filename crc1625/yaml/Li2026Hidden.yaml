publication:
  id: doi:10.48550/arXiv.2608.24357
  title: "A hidden low-temperature transformation pathway in compositionally complex materials"
  authors: [Yujiao Li, Elaheh Akbarnejad, Quentin Bizot, Aleksander Kostka, Natalia Pukhareva, Ridha Zerdoumi, Alan Savan, Matous Mrovec, Ralf Drautz, Baptiste Gault, Dierk Raabe, Alfred Ludwig]
  year: 2026
