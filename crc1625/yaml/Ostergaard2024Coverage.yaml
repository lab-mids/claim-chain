paper_assessment:
  overall_validity: PARTIAL
  summary: >-
    A careful DFT data set of coverage-resolved H binding energies on 100
    random IrPdPtRhRu(111) slabs and a transparent probability framework
    combining binding-energy distributions with a Frumkin repulsion term.
    The decomposition into ligand and repulsion effects is plausibly
    validated against explicit simulations. The two headline physical
    findings, larger repulsion on HEAs and a hysteresis, are partly
    artefacts of the sampling scheme and cell sizes by the authors' own
    statements, and the composition optimization rests on a barrier-free,
    Tafel-only model that is not validated against measured activities and
    ranks Pd above Pt.
  key_limitations:
    - "HEA and pure-metal repulsion slopes from different cells and schemes (OBS3, CLAIM1)."
    - "Hysteresis follows from the greedy path selection, called an artifact in the text (CLAIM3)."
    - "Reaction probability model is barrier-free and Tafel-only and unvalidated against experiment (ASM2, CLAIM4)."
    - "Optimal compositions at the edges of composition space where distributions are least representative (OBS6)."
    - "Sign and composition inconsistencies in the optimization results (OBS6)."
  missing_evidence:
    - "Measured HER activity of predicted Pd-Pt and Pd-Ru alloys."
    - "Pure-metal repulsion computed with the same cell and sampling scheme."
    - "Configurational or kinetic Monte Carlo of H arrangements including migration."
