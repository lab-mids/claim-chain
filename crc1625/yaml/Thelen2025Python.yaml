paper_assessment:
  overall_validity: PARTIAL
  summary: >-
    A software paper presenting a Python wrapper that parallelizes SIMTRA
    for multi-cathode co-sputtering, validated against EDS maps of seven
    Ni-Pd-Pt-Ru libraries. Agreement of a few percent (normalized
    Euclidean distance) is shown for most libraries, with plausible
    explanations for the outliers (unstable Pd discharge, cathode tilt).
    The validation is retrospective, uses rates calibrated after the
    depositions and an undisclosed chamber geometry, the 3.5% headline is
    not derived explicitly, and the recommended 1 degree tilt tolerance is
    looser than the sensitivity the paper itself reports.
  key_limitations:
    - "Retrospective validation only; no prospectively planned library (CLAIM3)."
    - "Outliers explained post hoc (CLAIM1, OBS4)."
    - "Undisclosed chamber geometry limits reproducibility (METH2)."
    - "Tilt tolerance and stated tilt deviation inconsistent with the scan (CLAIM2, OBS4)."
  missing_evidence:
    - "Prospective planning test of a new library."
    - "Timing benchmark versus number of cathodes."
    - "Explicit table of per-library mean distances and how 3.5% is computed."
