paper_assessment:
  overall_validity: PARTIAL
  summary: >-
    The paper defines entropy- and frequency-based property importance
    metrics, clusters KG properties into BM25F fields without supervision
    and evaluates the resulting entity search on DBpedia-Entity v2 and
    IMDb. The headline numbers recompute from Table 4 (about 70-78% over
    BM25, NDCG@10 within 1% of supervised BM25F-CA), and the comparison
    with tuned and reranked variants is thorough. The 'fully
    unsupervised' framing is weakened by choosing the best of sixteen
    configurations on the test queries and by BM25 parameters taken from
    supervised tuning; NDCG@100 remains 6% below BM25F-CA, the IMDb MAP is
    below QUIRA, vertical indexes do not help for Place, and significance
    tests are deferred to the repository.
  key_limitations:
    - "Configuration selected on the test benchmark (METH2, CLAIM1)."
    - "BM25 parameters 0.9/0.4 come from supervised tuning (ASM1)."
    - "NDCG@100 gap of 6% and IMDb MAP below QUIRA (OBS1, OBS4)."
    - "Domain independence inferred from two KGs and three types (CLAIM4)."
  missing_evidence:
    - "Cross-validated configuration choice on held-out queries."
    - "Per-query significance tests reported in the paper."
    - "Evaluation on a third KG from a different domain."
