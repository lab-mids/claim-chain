entities:
  - {id: ent:Film, label: "co-sputtered Pt77Cu23 film annealed 24 h at 900 °C, electrochemically dealloyed and annealed at 600 K in Ar/H2", entity_type: MATERIAL}
  - {id: ent:nSTM, label: "noise electrochemical STM (n-EC-STM) with reaction ON/OFF potential switching and FWHM activity profiles", entity_type: TECHNIQUE}
  - {id: ent:Char, label: "SEM, XRD with Thermo-Calc, XPS before and after electrochemistry", entity_type: TECHNIQUE}
