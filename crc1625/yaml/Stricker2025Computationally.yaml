paper_assessment:
  overall_validity: PARTIAL
  summary: >-
    A perspective-style demonstrator implements a pyiron job that runs
    uncertainty-sampling GPR against a dummy device replaying a measured
    five-element resistance library, with DFT- and word-embedding-derived
    priors used to choose starting points. The workflow and code are
    available, and the 7-fold reduction (50 of 342 points to reach the
    measurement uncertainty) recomputes for the best run. The claimed
    acceleration by priors is weakly supported: a best-of-40 selection is
    compared with the mean of random starts, each prior-based curve is a
    single run, the priors are rotated relative to the measured trend, a
    DFT-gradient initialization fails to converge, and a prior-free
    element-maximum start also converges quickly; only one library is
    tested and no live instrument is driven.
  key_limitations:
    - "Unfair baseline (best-of-40 vs random mean) and single runs (CLAIM2)."
    - "Prior-free heuristic performs similarly; DFT-gradient init fails (OBS2)."
    - "Dummy device replaying existing data (METH1)."
    - "One library and property; stopping chosen with ground truth (CLAIM1)."
  missing_evidence:
    - "Statistics over many runs and several libraries."
    - "Comparison against simple space-filling initializations."
    - "Live operation with a real instrument."
