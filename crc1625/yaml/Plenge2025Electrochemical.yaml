paper_assessment:
  overall_validity: PARTIAL
  summary: >-
    A computational framework that combines a DFT-trained linear regression
    of surface-atom dissolution energies with a Nernst-type dissolution
    potential and an iterative removal/relaxation scheme to simulate HEA
    nanoparticle dissolution. The Nernst corrections in Table 1 recompute
    correctly, and the regression accuracy near the applied potential is
    adequate for the discrete rule. The derived stability trends, core-shell
    formation and composition paths follow consistently from the model and
    agree qualitatively with literature on binary Pt alloys, but no
    experiment on the studied HEAs is reported, and results depend on an
    ad hoc 1e-6 M concentration, equal dissolution rates and a simplified
    relaxation. The authors themselves restrict validity to trends.
  key_limitations:
    - "No experimental validation on HEA particles; agreement only qualitative with binary Pt-alloy literature (CLAIM2)."
    - "Fixed 1e-6 M concentration and equal-rate batch dissolution shape Sd (ASM1, METH3)."
    - "Relaxation and missing diffusion bias comparisons involving Au (CLAIM4)."
  missing_evidence:
    - "Online ICP-MS dissolution of selected compositions (e.g. PdRu, PtRu, equimolar octo-metallic)."
    - "Sensitivity of Sd maps to concentration and relaxation choices."
