  id: doi:10.1007/s44210-025-00057-3
  title: "Electrochemical Dissolution: Paths in High-Entropy Alloy Composition Space"
  authors: [Mads K. Plenge, Jack K. Pedersen, Luis A. Cipriano, Jan Rossmeisl]
  year: 2025
  doi: 10.1007/s44210-025-00057-3
  url: https://doi.org/10.1007/s44210-025-00057-3

entities:
  - {id: ent:HEA, label: "Ag-Au-Cu-Ir-Pd-Pt-Rh-Ru high-entropy alloy nanoparticles (4 nm truncated octahedra)", entity_type: MATERIAL}
  - {id: ent:DFT, label: "DFT dissolution energies of surface atoms (CN 3-9) in 6000 HEA slabs from 100 compositions", entity_type: METHOD}
  - {id: ent:Reg, label: "per-metal linear regression on CN and neighbour identities", entity_type: METHOD}
  - {id: ent:Sim, label: "iterative dissolution simulation with particle relaxation at fixed potential (0.8 V vs RHE)", entity_type: METHOD}
  - {id: ent:Sd, label: "stability parameter Sd = N111(final)/N111(initial)", entity_type: QUANTITY}
