  id: doi:10.1039/d5nh00836k
  title: "Fluence-independent range of surface roughening within the Gaussian-shaped profile of a low-intensity ultrashort laser"
  authors: [N. Osterloh, M. Vyshnepolsky, T. Pan, K. Morgenstern]
  year: 2026
  doi: 10.1039/d5nh00836k
  url: https://doi.org/10.1039/d5nh00836k

entities:
  - {id: ent:Cu511, label: "vicinal Cu(511) single crystal in UHV, imaged at 7 K", entity_type: MATERIAL}
  - {id: ent:Laser, label: "400 nm, 50 fs, 250 kHz pulses, 1-4 s irradiation, 7.8-9 mJ/cm2 absorbed average fluence", entity_type: TECHNIQUE}
  - {id: ent:STM, label: "low-temperature beetle STM with slip-stick mapping of 400 adjacent images across the laser spot", entity_type: TECHNIQUE}
  - {id: ent:Cov, label: "laser-induced adatom-cluster coverage vs locally absorbed fluence", entity_type: QUANTITY}
