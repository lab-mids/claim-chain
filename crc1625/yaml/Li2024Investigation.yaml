publication:
  id: doi:10.1002/admi.202400772
  title: "Investigation of Solid-State Interface Reactions Between the Compositionally Complex Solid Solution Noble Metal Alloy Ag-Au-Pd-Pt and Si"
  authors: [Yujiao Li, Aleksander Kostka, Alan Savan, Alfred Ludwig]
  year: 2024
  doi: 10.1002/admi.202400772
  url: https://doi.org/10.1002/admi.202400772

entities:
  - {id: ent:Film, label: "100 nm Ag25Au15Pd50Pt10 (nominal) co-sputtered fcc thin film", entity_type: MATERIAL}
  - {id: ent:CPP, label: combinatorial processing platform (36 pre-sharpened Si microtips with native oxide), entity_type: METHOD}
  - {id: ent:NativeOx, label: native Si oxide as reaction barrier, entity_type: MATERIAL}
  - {id: ent:Silicide, label: "ternary (Pd,Pt)2Si silicide (Pd2Si-type, P-6m2)", entity_type: MATERIAL}
  - {id: ent:AgAu, label: Ag-Au-rich fcc phase depleted in Pd and Pt, entity_type: MATERIAL}
