paper_assessment:
  overall_validity: WEAK
  summary: >-
    A short study comparing Pb-UPD on combinatorial AgxAuy films and
    nanoparticles with pure Ag and Au references. The voltammetric data
    consistently show deposition near the Pb-on-Ag potential and stripping
    near the Pb-on-Au(111) potential, supporting an Ag-enriched surface.
    The central conclusion of an Ag-Au atomic swap under the Pb adlayer
    rests on peak assignments differing by 20-60 mV, on a highly simplified
    DFT model without solvent, and on no direct structural or compositional
    evidence; the swap time bound follows from the same assumption, and
    the stated electrode area is off by a factor of 1000.
  key_limitations:
    - "Swap inferred from peak positions only; alternatives not excluded (CLAIM2)."
    - "DFT model omits water and reconstruction (OBS4, CLAIM3)."
    - "Assumes alloy UPD peaks coincide with pure-metal peaks (CLAIM1, CLAIM2)."
    - "Area stated as 0.028 mm2 for a 6 mm opening (METH1)."
  missing_evidence:
    - "In situ structural or emersion-XPS evidence of surface composition with and without Pb."
    - "UPD on AgAu single crystals of known surface composition."
    - "DFT including water and exchange energetics."
