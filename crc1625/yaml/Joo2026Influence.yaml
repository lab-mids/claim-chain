  title: "Influence of Ru Content on Defect Formation and Electrocatalytic Activity of Au-Pd-Pt-Ru Compositionally Complex Solid Solution Thin Films for the Hydrogen Evolution Reaction"
  authors: [Miran Joo, Huixin Xiu, Sabrina Baha, Ridha Zerdoumi, Ningyan Cheng, Christoph Somsen, Yujiao Li, Aleksander Kostka, Wolfgang Schuhmann, Alfred Ludwig, Christina Scheu]
