  url: https://doi.org/10.1021/acsnano.6c01692

entities:
  - {id: ent:Probe, label: "double-barrel SECCM capillary with an electrodeposited, FIB-flattened Au or Pt SECM nanoelectrode in the carbon barrel", entity_type: METHOD}
  - {id: ent:SGTC, label: "substrate generation/tip collection voltammetry in scan-hopping SECCM-SECM", entity_type: TECHNIQUE}
  - {id: ent:Subs, label: "Pt, Au thin film, electrodeposited Bi on glassy carbon, drop-cast Ag-Bi2O3 nanofibres on glassy carbon", entity_type: MATERIAL}
