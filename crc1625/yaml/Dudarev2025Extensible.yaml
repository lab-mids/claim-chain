paper_assessment:
  overall_validity: WEAK
  summary: >-
    A system description of MatInf, an open-source research data
    management system with a set-theoretic materials model, typed
    extensible properties, an object graph and delegation of new file
    types to external services. The design is described clearly, and the
    visualisation and search features are shown and publicly accessible.
    The evaluative claims - adaptability to any lab, successful use in
    several tenants, superiority over existing RDMS, high performance -
    are not backed by any usage data, benchmark, user study or feature
    comparison, and the access-control text announces three levels but
    lists four.
  key_limitations:
    - "No deployment or usability data behind adaptability claims (CLAIM2)."
    - "No systematic comparison with NOMAD, Kadi4mat, Chemotion, openBIS (CLAIM3, GAP1)."
    - "No performance benchmark (CLAIM4)."
    - "No implemented external type service demonstrated (CLAIM1)."
  missing_evidence:
    - "Usage statistics of production tenants and adaptation effort per lab."
    - "Feature comparison table against existing RDMS."
    - "Worked example of adding a new data type via an external service."
