paper_assessment:
  overall_validity: WEAK
  summary: >-
    The paper compares a composition GP, a GP on Word2Vec material vectors
    and a new standard-vector similarity method for extrapolating ORR
    activity from two ternary libraries to their shared quaternary. Data
    and code are open, and the embedding GP does reduce error metrics. The
    headline claims are not supported as stated: the standard vector
    method's r = 0.94 holds only for a filtered subset of unstated size,
    its overall r (0.80) is the lowest of the three models, and its
    defining equations mix a 17-d and a 200-d vector; Table 3 lists a mean
    prediction below the minimum, the embedding GP misses the most active
    compositions, units switch between mA and mA cm-2, and the attribution
    to literature knowledge lacks a random-embedding control.
  key_limitations:
    - "Standard vector superiority rests on a filtered subset; overall r is worst (CLAIM2, OBS4)."
    - "Arithmetically impossible Table 3 entry and mA vs mA cm-2 mix-up (OBS3, DATA1)."
    - "Dimension mismatch in the standard vector formalism (METH1)."
    - "No ablation or random-embedding control for the latent-knowledge attribution (CLAIM3)."
    - "Single ternary-to-quaternary task without uncertainties (HYP1)."
  missing_evidence:
    - "Subset size and confidence intervals for all correlations."
    - "Random and physical-descriptor embedding baselines."
    - "A second extrapolation task or leave-one-ternary-out validation."
