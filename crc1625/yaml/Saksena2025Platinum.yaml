paper_assessment:
  overall_validity: WEAK
  summary: >-
    The paper reports an irreversible eQCM mass gain and rising
    overpotential during 12 h galvanostatic HER/DER on Pt films and APT
    detection of deuterium (about 15 at.% plateau, about 10 nm deep)
    after DER, concluding that Pt is not proton-blocking. The APT
    detection of subsurface D is the strongest evidence and the fitted
    diffusion coefficient is consistent with the profile depth. The
    central causal claim fails on the paper's own numbers: the 1.8-2.9
    µg/cm2 mass gains correspond to H/Pt or D/Pt of 0.7-2.4 over the whole
    110 nm film, about 75 times more D than the APT profile contains, so
    the mass gain and overpotential drift need another cause (e.g.
    impurity deposition from non-ultrapure acid or QCM artefacts during
    gas evolution), which is not tested. Results rest on single samples,
    and the isotope argument invokes the nuclear charge radius.
  key_limitations:
    - "eQCM mass gain incompatible with APT D content (CLAIM1, OBS3)."
    - "No control for impurity deposition or QCM artefacts (METH1)."
    - "Single electrode and single APT profile; overprecise D (CLAIM2)."
    - "Inappropriate physical argument for isotope effect (CLAIM3)."
  missing_evidence:
    - "Quantitative TDS/NRA of absorbed H/D on the QCM electrodes."
    - "Ultrapure-electrolyte and Au-reference eQCM controls."
    - "Repeat APT measurements at several sites and cryo transfer."
