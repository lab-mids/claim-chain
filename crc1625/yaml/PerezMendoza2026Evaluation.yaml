paper_assessment:
  overall_validity: PARTIAL
  summary: >-
    A careful methods paper: the surface-height-first protocol avoids pipette
    crashes, and the systematic tests of Ar flow, electrolyte concentration
    and conditioning potential convincingly show how each shifts the
    SECCM-measured PZC of textured Pt(111), with ~0.30 V vs SHE recovered at
    pH 3 and the micrometre pipette. The headline submicron claim holds best
    for ~500 nm; at ~250 nm the median moves by +38 mV, transients near the
    PZC are at the noise floor, the precision is limited to steps above 80 mV,
    and the excess apparent capacitance remains about four times too large
    even after instrument subtraction. The conclusion that the measured value
    reflects purely capacitive charge contradicts the paper's own statement
    that free and adsorption charge cannot be separated. The PZC-HER
    correlation rests on three conditioning groups with a common cause.
    Draft annotation; SI tables were not inspected.
  key_limitations:
    - "240 nm results at the detection limit and offset from 0.30 V (OBS4, CLAIM1)."
    - "'Purely capacitive' claim not separable by the method (CLAIM2, LIM1)."
    - "PZC-HER correlation from three groups, wetted area unknown (CLAIM4)."
    - "~30% of spots removed by an R2 filter (METH1)."
  missing_evidence:
    - "Co-located EBSD to test structure sensitivity at submicron scale."
    - "Wetted-area measurement per contact (post-mortem imaging)."
    - "Independent PZTC/PZFC separation (e.g. CO displacement) on the same film."
