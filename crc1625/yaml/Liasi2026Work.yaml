paper_assessment:
  overall_validity: PARTIAL
  summary: >-
    A carefully controlled descriptor study. The key negative result - that
    the work function adds almost nothing once adsorption energies are
    corrected for near-monolayer coverage - is backed by consistent
    within-library, leave-one-library-out, shuffle, collinearity and
    residualisation controls, and the reported numbers (0.22 eV shift, 0.245
    eV/ML mean repulsion, ~0.9 ML coverage, R2 gains, Tafel slopes)
    recompute. The positive framing is weaker: the work function's
    'genuine descriptor' status rests on R2_log values that include
    overpotential variance and are not compared with a descriptor-free or
    simple composition baseline, while the paper's own residualisation shows
    the work function is essentially a function of composition. The coverage
    correction relies on a repulsion coefficient with large spread and four
    untested approximations, and surface segregation (shown for the same
    alloy family) is ignored. Draft annotation; parity plots were not
    inspected.
  key_limitations:
    - "No null or composition-only baseline for R2_log (METH3, R9)."
    - "Work function is a composition proxy (OBS3, R8)."
    - "Coverage correction approximations (METH2)."
    - "Surface segregation not modelled (LIM1)."
  missing_evidence:
    - "R2_log of a model with only the Tafel term and of a linear composition model."
    - "Alloy space where work function and adsorption energy rank metals differently (Ir/Rh)."
    - "Descriptor inference including segregated surface compositions."
