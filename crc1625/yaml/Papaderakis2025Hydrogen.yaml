publication:
  id: doi:10.1016/j.actamat.2025.120756
  title: "Hydrogen induced superhydrophilicity in an amorphous CrFeNi-based multi-principal element alloy thin film"
  authors: [Athanasios A. Papaderakis, Eirini-Maria Paschalidou, León Zendejas Medina, Ezgi Hatipoglu, Aparna Saksena, Baptiste Gault, Birhan Sefer, David Malmström, Pouya Hosseini, Oliver Trost, Adrianna Lozinko, Mohini Ramkaran, Anne Juel, Kristina Tschulik, Robert A.W. Dryfe]
  year: 2025
  doi: 10.1016/j.actamat.2025.120756
  url: https://doi.org/10.1016/j.actamat.2025.120756

entities:
  - {id: ent:Film, label: "amorphous Cr28Fe29Ni28Ta15 thin film (~460 nm) on SiO2/Si, sub-nm roughness", entity_type: MATERIAL}
  - {id: ent:NativeOx, label: "native oxide rich in Fe, Cr, Ta and free of Ni", entity_type: MATERIAL}
  - {id: ent:Electrowetting, label: contact angle of a 1 M H2SO4 droplet under potential control (Pt pseudo-reference), entity_type: TECHNIQUE}
  - {id: ent:TDS, label: thermal desorption spectroscopy with mass spectrometry, entity_type: TECHNIQUE}
