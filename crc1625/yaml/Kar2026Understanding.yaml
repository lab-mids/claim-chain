id: claimchain:chain/Kar2026Understanding
schema_version: 0.6.0
annotator: Claude Opus 5.5 (Claude Code, manual encoding from the PDF text of the preprint version 'Epitaxial Films as Model Platform for Understanding Compositionally Complex Electrocatalysts'; figures judged from captions and text)
