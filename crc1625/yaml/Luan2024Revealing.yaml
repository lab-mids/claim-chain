  - {id: luan2024:R11, subject: luan2024:OBS4, predicate: UNDERCUTS, object: luan2024:CLAIM2, asserted_by: ANNOTATOR, note: "Fe dissolves steadily (141 to 431 ng/cm2) without evidence of return"}
