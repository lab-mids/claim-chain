publication:
  id: doi:10.1002/adts.202500958
  title: "Determining the Potential of Maximum Entropy from Ab Initio Molecular Dynamics"
  authors: [Amanda S. Petersen, Thor K. Madsen, Theophilus K. Sarpey, Christian M. Schott, Elena L. Gubanova, Adrian V. Himmelreich, Aliaksandr S. Bandarenka, Jan Rossmeisl]
  year: 2025
