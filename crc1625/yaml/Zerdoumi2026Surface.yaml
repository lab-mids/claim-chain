paper_assessment:
  overall_validity: PARTIAL
  summary: >-
    The experimental core is sound: two libraries with permuted cathodes,
    single-phase fcc and smooth surfaces, and XPS at 18 areas consistently
    show Ag near-surface enrichment and Pt depletion against EDX volume
    composition. The breadth claim ('maps across 684 compositions') rests on
    element-wise linear extrapolation from nine XPS points per library,
    which sits awkwardly with the paper's own emphasis on non-additive
    multi-element effects. The XPS was ex situ, with oxygen not quantified
    and an implausibly small quantification uncertainty, so oxidation-driven
    Ag segregation in air is a live alternative to the vacuum surface-energy
    explanation. Simulations agree for three elements but predict Au
    enrichment and Pt clustering that are not seen, so they cannot 'confirm'
    a thermodynamic origin. The roughness argument overstates the margin.
    Draft annotation; figure-based judgements rely on captions.
  key_limitations:
    - "Surface maps extrapolated from nine XPS points per library (ASM1, R7)."
    - "Ex-situ XPS; oxidation not quantified (METH1, R11)."
    - "Simulation agreement partial, Au mismatch explained post hoc (CLAIM3, R13)."
    - "Catalysis implications not tested (CLAIM5)."
  missing_evidence:
    - "XPS at held-out MAs or full-library XPS mapping."
    - "Chemical-state analysis (Ag/Pd oxides) or UHV-transfer XPS / LEIS."
    - "Simulations including adsorbates or annealing experiments."
