publication:
  id: doi:10.1186/s13321-026-01180-y
  title: "Evolve with your research: stepwise system evolution from document-driven to fact-centric research data management in materials science"
  authors: [Victor Dudarev, Alfred Ludwig]
  year: 2026
  doi: 10.1186/s13321-026-01180-y
  url: https://doi.org/10.1186/s13321-026-01180-y

entities:
  - {id: ent:MatInf, label: "MatInf research data management system (CRC/TRR 247 tenant)", entity_type: METHOD}
  - {id: ent:STAR, label: "STAR paradigm - Statefulness, Traceability, Aim, Result - for graph-based research records", entity_type: CONCEPT}
  - {id: ent:SET, label: "SET methodology - Standardise, Extract, Test - for moving document types to factographic data", entity_type: METHOD}
