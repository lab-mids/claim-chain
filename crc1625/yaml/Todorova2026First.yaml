paper_assessment:
  overall_validity: PARTIAL
  summary: >-
    A conceptual review of how to embed electrified interfaces in DFT
    supercells: surrogate double-layer models, constant-charge versus
    constant-field versus open boundary conditions, a fluctuation-
    dissipation-based thermopotentiostat, and dielectric-breakdown limits.
    The electrostatic arguments are coherent, and the inadequacy of
    constant charge for reactive simulations and the breakdown limits
    follow directly from the physics discussed. The comparative
    conclusions rest on one illustrative model simulation from the
    authors' own work, the recommendation of the authors' thermopotentiostat
    is not accompanied by timings or a rate benchmark against other
    schemes, and the stated size of potential fluctuations (±1 V)
    depends on an unstated capacitance, with kBT/C and sqrt(kBT/C) used
    interchangeably.
  key_limitations:
    - "Comparative claims illustrated by a single model system (OBS2, CLAIM1)."
    - "No quantitative benchmark of rates or overhead for the recommended method (CLAIM2)."
    - "Fluctuation magnitude depends on an unstated capacitance (OBS3)."
  missing_evidence:
    - "Side-by-side reaction-barrier or rate calculations under the three boundary conditions."
    - "Timing overhead of the thermopotentiostat in production AIMD."
