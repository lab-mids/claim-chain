  title: "Cation-Dependent Interfacial Properties Determine the Activity of Pt(111) Electrodes in Alkaline Media"
  authors: [Haiting Yu, Song Xue, Elena L. Gubanova, Jian Zhou, Rodrigo Bautista, Adrian V. Himmelreich, Aliaksandr S. Bandarenka]
  year: 2025
