  title: "Integration of Scanning Electrochemical Microscopy and Scanning Electrochemical Cell Microscopy in a Bifunctional Nanopipette toward Simultaneous Mapping of Activity and Selectivity in Electrocatalysis"
  authors: [Ridha Zerdoumi, Thomas Quast, Emmanuel Batsa Tetteh, Moonjoo Kim, Lejing Li, Stefan Dieckhöfer, Wolfgang Schuhmann]
