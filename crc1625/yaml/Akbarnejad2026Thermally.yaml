  - {id: ent:CCSS, label: "~50 nm sputtered Ag-Au-Pd-Pt film (~Ag24Au18Pd50Pt8 by APT), nanocrystalline fcc", entity_type: MATERIAL}
  - {id: ent:CPP, label: "combinatorial processing platform - 36-tip Si microtip array coated with the film for direct APT", entity_type: METHOD}
