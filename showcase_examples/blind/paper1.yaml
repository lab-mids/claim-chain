statements:

  # ================= Abstract =================
  - id: paper1:CLAIM1
    statement_type: CLAIM
    paper_part: ABSTRACT
    section: Abstract
    text: Pettifor embeddings systematically outperform other commonly used elemental embeddings in compositional machine learning models.
    about: [ent:PettEmb, ent:CrabNet]
    claim_role: MAIN_CONCLUSION
    author_certainty: DEMONSTRATED
    claim_modality: COMPARATIVE
    concerns:
      - {concern_type: OVERCLAIM, priority: HIGH, description: "Table 2 shows Pettifor best in 12 of 27 tasks and beaten by plain one-hot encoding in 8 of 27 and by CGCNN initial features in 9 of 27; this is not systematic outperformance."}
      - {concern_type: MISSING_QUANTIFICATION, priority: HIGH, description: "MAEs are averages of 8 runs but no standard deviation is given, so most margins (often 1-2 %) cannot be distinguished from training noise."}
      - {concern_type: CONFOUNDED_COMPARISON, priority: MEDIUM, description: "Only one learned embedding (Mat2Vec) is compared; the stronger learned or data-mined embeddings named in the introduction (refs. 28-30) are not benchmarked, although the introduction says they consistently perform better."}
    assessment:
      validity: PARTIAL
      rationale: "Pettifor has the best mean rank (1.96) and the most wins (12/27) in Table 2, but loses to one-hot in 8 and to CGCNN in 9 tasks, wins none of the five smallest datasets, and no run-to-run spread is reported; 'systematically' is not supported."
      missing_evidence:
        - Standard deviation of the MAE over the 8 CrabNet runs for every embedding and dataset
        - Paired significance test (e.g. Wilcoxon over datasets) of Pettifor vs one-hot and vs CGCNN
        - Benchmark against the learned embeddings of refs. 28-30
      proof_obligations:
        - text: Show that Pettifor beats each baseline by more than run-to-run noise on most datasets.
          obligation_status: OPEN
          priority: CRITICAL
          discharged_by: [paper1:OBS7]
          requested_data:
            - {quantity: MAE standard deviation over 8 runs per embedding and dataset, unit: dataset units, method: CrabNet retraining with fixed splits}
        - text: Show that Pettifor wins against the strongest baselines, not only on average rank.
          obligation_status: PARTIALLY_DISCHARGED
          discharged_by: [paper1:OBS7]
          priority: HIGH

  - id: paper1:CLAIM2
    statement_type: CLAIM
    paper_part: ABSTRACT
    section: Abstract
    text: Two-dimensional maps built from Pettifor embeddings and UMAP succeed in physically separating material classes according to basic physical properties.
    about: [ent:PettSTR, ent:UMAP, ent:Alex]
    claim_role: MAIN_CONCLUSION
    author_certainty: DEMONSTRATED
    claim_modality: GENERALIZATION
    concerns:
      - {concern_type: OVERGENERALIZATION, priority: HIGH, description: "The paper's own Fig. 5 (bottom) shows no good separation of magnetic and non-magnetic compounds; separation is shown for metal/non-metal and roughly for crystal system only."}
      - {concern_type: MISSING_QUANTIFICATION, priority: HIGH, description: "Separation is judged by eye; no cluster-purity, silhouette or nearest-neighbour classification score and no comparison map from another embedding is given for Figs. 4-5."}
    assessment:
      validity: PARTIAL
      rationale: "Metal/non-metal and partial crystal-system separation are reported (judged from captions and text of Figs. 4-5; figures not available), but the magnetic map in the same figure fails, and no metric or baseline map is given."
      missing_evidence:
        - Quantitative separation score (kNN accuracy or silhouette in the 2D map and in the full space) for each property
        - Same maps from one-hot, Magpie and Mat2Vec embeddings as baselines
      proof_obligations:
        - text: Quantify separation of each property class in the map and compare with baseline embeddings.
          obligation_status: OPEN
          priority: CRITICAL
          requested_data:
            - {quantity: kNN classification accuracy of metal/non-metal and magnetic labels, unit: '%', method: "in 2D UMAP and in full Pettifor + STR space, vs one-hot baseline"}
        - text: Show the separation is robust to UMAP parameters.
          obligation_status: PARTIALLY_DISCHARGED
          discharged_by: [paper1:LIM2]
          priority: MEDIUM

  # ================= Introduction =================
  - id: paper1:BG1
    statement_type: BACKGROUND
    paper_part: INTRODUCTION
    section: Introduction, para. 1
    text: High-throughput density functional theory and machine learning have produced materials databases that catalogue most known compounds and millions of hypothetical phases together with their properties.
    evidence:
      - {evidence_kind: CITATION, references: ['1', '2', '3', '4', '5', '6', '7']}
  - id: paper1:BG2
    statement_type: BACKGROUND
    paper_part: INTRODUCTION
    section: Introduction, para. 2-3
    text: Structure maps correlate the structure type of a compound with its constituents, and for binary compounds two-dimensional maps along an element ordering such as the Pettifor scale are easy to make.
    evidence:
      - {evidence_kind: CITATION, references: ['8', '9', '10', '11', '12', '13', '14', '15', '16']}
  - id: paper1:GAP1
    statement_type: GAP
    paper_part: INTRODUCTION
    section: Introduction, para. 2-4
    text: For ternary or multinary compounds and for datasets with several crystal structures there is no representation of a compound that is both humanly interpretable and suitable for materials informatics.
  - id: paper1:BG3
    statement_type: BACKGROUND
    paper_part: INTRODUCTION
    section: Introduction, para. 4
    text: Embeddings from trained neural networks such as crystal graph networks, combined with dimension reduction, are used to map properties over materials space.
    evidence:
      - {evidence_kind: CITATION, references: ['17', '18', '19', '20', '21']}
  - id: paper1:GAP2
    statement_type: GAP
    paper_part: INTRODUCTION
    section: Introduction, para. 4 and 6
    text: Trained embeddings contain information about the target property and learned or text-mined elemental embeddings act as black boxes, so they hamper interpretation of structure-property relationships even though they perform better in predictive tasks.
    evidence:
      - {evidence_kind: CITATION, references: ['34']}
  - id: paper1:BG4
    statement_type: BACKGROUND
    paper_part: INTRODUCTION
    section: Introduction, para. 7
    text: A chemical similarity scale between elements was previously built from substitution statistics of experimentally known compounds in the ICSD.
    about: [ent:ICSD]
    evidence:
      - {evidence_kind: CITATION, references: ['35', '36']}
  - id: paper1:BG5
    statement_type: BACKGROUND
    paper_part: INTRODUCTION
    section: Introduction, para. 8
    text: Earth Mover's Distance approaches such as ElMD compare compositions using data-mined chemical similarity encoded in a one-dimensional element ordering.
    about: [ent:ElMD, ent:CGRID]
    evidence:
      - {evidence_kind: CITATION, references: ['15', '37', '38', '39']}
  - id: paper1:HYP1
    statement_type: HYPOTHESIS
    paper_part: INTRODUCTION
    section: Introduction, para. 6-9
    text: A non-orthogonal compositional space in which the angle between element axes encodes ICSD substitution similarity, combined with a structural fingerprint, gives a material representation that is both humanly interpretable and a more powerful machine-learning input than commonly used elemental embeddings.
    about: [ent:PettEmb, ent:PettSTR]
    claim_role: MAIN_CONCLUSION
    author_certainty: DEMONSTRATED
    claim_modality: COMPARATIVE
    assessment:
      validity: PARTIAL
      rationale: "Interpretability holds by construction and the elemental similarities look chemically sensible; the ML advantage is best on average in Table 2 but not systematic, has no error bars, and fails for small datasets; map interpretability rests on visual inspection only."
      missing_evidence:
        - Run-to-run spread and significance of the Table 2 differences
        - Quantitative measure of map quality against baseline embeddings
        - Sensitivity of results to the exponent alpha and the composition/structure weighting
      proof_obligations:
        - text: The similarity encoded in S reflects chemical similarity.
          obligation_status: PARTIALLY_DISCHARGED
          discharged_by: [paper1:CLAIM3, paper1:CLAIM5, paper1:CLAIM6]
          priority: HIGH
        - text: The embedding improves ML predictions over the baselines beyond training noise.
          obligation_status: PARTIALLY_DISCHARGED
          discharged_by: [paper1:CLAIM9]
          priority: CRITICAL
          requested_data:
            - {quantity: MAE mean and standard deviation over 8 runs, unit: dataset units, method: CrabNet on 27 benchmarks}
        - text: Maps from the embedding separate material classes in an interpretable way.
          obligation_status: PARTIALLY_DISCHARGED
          discharged_by: [paper1:CLAIM8, paper1:CLAIM12, paper1:CLAIM14]
          priority: HIGH
        - text: Results are robust to the ad hoc choices (alpha = 1/2, equal weights, UMAP parameters).
          obligation_status: OPEN
          priority: MEDIUM
          requested_data:
            - {quantity: Table 2 MAE and Table 1 neighbours for alpha in 0.25-1, unit: dataset units, method: recomputed S}
  - id: paper1:AIM1
    statement_type: AIM
    paper_part: INTRODUCTION
    section: Introduction, para. 7
    text: The paper constructs a non-orthogonal compositional space from the ICSD similarity measure and represents compositions in it (Pettifor embeddings).
    author_certainty: DEMONSTRATED
  - id: paper1:AIM2
    statement_type: AIM
    paper_part: INTRODUCTION
    section: Introduction, para. 5
    text: The paper combines the compositional representation with the pymatgen structural fingerprint to represent compounds with arbitrary composition and structure.
    author_certainty: DEMONSTRATED
  - id: paper1:AIM3
    statement_type: AIM
    paper_part: INTRODUCTION
    section: Introduction, final para.
    text: The paper shows that the non-orthogonal representation captures meaningful chemical relationships between elements.
    author_certainty: DEMONSTRATED
  - id: paper1:AIM4
    statement_type: AIM
    paper_part: INTRODUCTION
    section: Introduction, final para.
    text: The paper generates interpretable two-dimensional visualizations of material space from the representation.
    author_certainty: DEMONSTRATED
  - id: paper1:AIM5
    statement_type: AIM
    paper_part: INTRODUCTION
    section: Introduction, final para.
    text: The paper shows that the representation provides powerful embeddings for machine learning while keeping human-understandable connections to chemistry.
    author_certainty: DEMONSTRATED
  - id: paper1:ASM1
    statement_type: ASSUMPTION
    paper_part: INTRODUCTION
    section: Introduction, para. 8
    text: Co-occurrence of two elements on the same site of the same crystal structure in the ICSD measures their chemical similarity.
    about: [ent:ICSD, ent:Smat]
    assumption_basis: COMMUNITY_ACCEPTED
    open_question: How much of the measured similarity reflects ICSD bias and incompleteness (sparsely studied elements such as Po or actinides) rather than chemistry?
    evidence:
      - {evidence_kind: CITATION, references: ['15', '35']}
  - id: paper1:LIM1
    statement_type: LIMITATION
    paper_part: INTRODUCTION
    section: Introduction, para. 8
    limitation_kind: DATA
    text: Spurious correlations may arise from bias and incompleteness of the ICSD, and the statistics and embeddings should be updated as new experimental data appear.

  # ================= Methods =================
  - id: paper1:METH1
    statement_type: METHOD
    paper_part: METHODS
    section: Methods, Pettifor embeddings, para. 1
    text: "The raw symmetric matrix M from ref. 35 counts, for each element pair, the ICSD compounds that share a crystal structure with one element substituted by the other, with the number of compounds containing the element on the diagonal; each row is normalized to unity to give substitution probabilities."
    about: [ent:ICSD, ent:Smat]
    evidence:
      - {evidence_kind: CITATION, references: ['35']}
  - id: paper1:METH2
    statement_type: METHOD
    paper_part: METHODS
    section: Methods, Pettifor embeddings, para. 2
    text: To counter the ICSD bias toward diagonal terms, the substitution probabilities are raised to the power alpha = 1/2 and renormalized row-wise; the rows of the resulting matrix S are unit vectors whose dot products give element similarities.
    about: [ent:Smat]
    evidence:
      - {evidence_kind: CITATION, references: ['15']}
    concerns:
      - {concern_type: AD_HOC_PARAMETER, priority: MEDIUM, description: "alpha = 1/2 is chosen to rebalance diagonal and off-diagonal terms, but no sensitivity of Table 1 or Table 2 to alpha is shown."}
      - {concern_type: REPRODUCIBILITY, priority: LOW, description: "The norm used in the row-wise renormalization is not stated; the square root of an L1-normalized row already has unit L2 norm, so an L2 renormalization would be redundant and an L1 one would not give unit vectors."}
  - id: paper1:METH3
    statement_type: METHOD
    paper_part: METHODS
    section: Methods, Pettifor embeddings, para. 3-4, Figs. 7-8
    text: The fingerprint of a composition is f = c x S, with c the vector of stoichiometric fractions; because c is L1-normalized, compositions lie on an (N-1)-dimensional simplex and only elementary substances lie on the unit sphere.
    about: [ent:PettEmb]
    concerns:
      - {concern_type: INTERNAL_INCONSISTENCY, priority: MEDIUM, description: "The abstract and introduction say the chemical composition is defined by a point on the unit sphere of the non-orthogonal space; the Methods state the composition vectors are in general not on the unit sphere."}
  - id: paper1:METH4
    statement_type: METHOD
    paper_part: RESULTS
    section: Results, Embeddings with structural information; Discussion para. 1
    text: Composition and structure are combined by concatenating the Pettifor embedding with the pymatgen local-coordination fingerprint (61 order parameters x 4 statistics = 244 dimensions) with equal weights, giving the Pettifor + STR embedding.
    about: [ent:PettSTR, ent:STRfp]
    evidence:
      - evidence_kind: DATA_QUANTITATIVE
        locator: Discussion, para. 1
        values:
          - {symbol: n_op, quantity: local order parameters, value: 61}
          - {symbol: n_stat, quantity: statistics per order parameter, value: 4}
          - {symbol: n_str, quantity: structure dimensions stated, value: 244}
        derived_checks:
          - {expression: "61 x 4 = 244", formula: "n_op*n_stat", result: 244}
    concerns:
      - {concern_type: AD_HOC_PARAMETER, priority: MEDIUM, description: "Equal weights are chosen 'for simplicity'; the effect of the weight on maps, PCA and neighbour searches is not shown."}
      - {concern_type: REPRODUCIBILITY, priority: MEDIUM, description: "What 'equal weights' means for blocks of 244 and about 90 dimensions with different norms (scaling, normalization of the STR block) is not stated."}
  - id: paper1:METH5
    statement_type: METHOD
    paper_part: RESULTS
    section: Results, Similarity of chemical elements
    text: Embeddings are reduced to two dimensions with UMAP; the effect of UMAP parameters is shown only in the ESI.
    about: [ent:UMAP]
    concerns:
      - {concern_type: REPRODUCIBILITY, priority: LOW, description: "The UMAP parameters (number of neighbours, minimum distance, metric) used for Figs. 2-5 are not given in the main text."}
  - id: paper1:METH6
    statement_type: METHOD
    paper_part: RESULTS
    section: Results, Fingerprint for chemical composition, Table 2
    text: CrabNet is trained with Mat2Vec, Magpie, CGCNN initial atomic features, one-hot and Pettifor embeddings on 27 benchmark datasets of ref. 34, and the errors are averaged over 8 runs.
    about: [ent:CrabNet, ent:Bench27]
    concerns:
      - {concern_type: REPRODUCIBILITY, priority: MEDIUM, description: "Train/test splits, hyperparameters and whether hyperparameters were re-tuned per embedding are not reported."}
      - {concern_type: MISSING_QUANTIFICATION, priority: HIGH, description: "No spread over the 8 runs is reported."}
  - id: paper1:DATA1
    statement_type: DATA
    paper_part: RESULTS
    section: Table 2
    text: The ML benchmark comprises 27 datasets from 312 (steel yield strength) to 239190 entries (OQMD), 25 regression tasks scored by MAE and 2 classification tasks scored by ROC AUC.
    about: [ent:Bench27]
    scope: {sample_count: 27, scope_note: "27 datasets, 312-239190 entries each"}
  - id: paper1:DATA2
    statement_type: DATA
    paper_part: RESULTS
    section: Results, Fingerprint for chemical composition, Fig. 3
    text: The perovskite dataset of ref. 42 contains cubic Pm-3m ABC3 compounds with 5-atom cells, of which the lower-energy member of each ABC3/BAC3 pair is plotted.
    about: [ent:Perov]
    evidence:
      - {evidence_kind: CITATION, references: ['42']}
  - id: paper1:DATA3
    statement_type: DATA
    paper_part: RESULTS
    section: Results, Embeddings with structural information
    text: The structure maps use all compounds on the convex hull of the Alexandria database, over 115 thousand compounds.
    about: [ent:Alex]
    scope: {sample_count: 115000, scope_note: "over 115 thousand hull compounds; exact number not given"}
    evidence:
      - {evidence_kind: CITATION, references: ['3']}
  - id: paper1:ASM2
    statement_type: ASSUMPTION
    paper_part: RESULTS
    section: Results, Figs. 2-5
    text: Proximity and clusters in a two-dimensional UMAP projection reflect similarity in the full embedding space.
    about: [ent:UMAP]
    assumption_basis: AUTHOR_CHOICE
    open_question: How much of the clustering in Figs. 2-5 is an artefact of UMAP, which is known to form clusters and to distort global distances?
    note: Implicit in all map-based claims; the authors concede that 2D reduction may distort distances.

  # ================= Results: elements =================
  - id: paper1:OBS1
    statement_type: OBSERVATION
    paper_part: RESULTS
    section: Results, Similarity of chemical elements, Fig. 2 (top)
    text: In the UMAP map of the Pettifor element embeddings, lanthanides and actinides lie in the top left, transition metals in the middle, and non-metals together with the alkali elements in the bottom right.
    about: [ent:PettEmb, ent:UMAP]
    scope: {sample_count: 1, scope_note: "one map of about 90 elements, noble gases removed"}
    evidence:
      - {evidence_kind: DATA_QUALITATIVE, locator: "Fig. 2 top", description: "Figure not available; judged from caption, text and extracted labels. The extracted label positions place alkalis (Li, Na, K, Rb, Cs, Fr) next to halogens, H and O."}
  - id: paper1:OBS2
    statement_type: OBSERVATION
    paper_part: RESULTS
    section: Results, Similarity of chemical elements, Fig. 2 (bottom), ESI Fig. S1
    text: The one-hot embedding gives an unstructured element map because all elements are equidistant, and Magpie, Mat2Vec, Jarvis and CGCNN maps are shown only in the ESI.
    about: [ent:OneHot, ent:Magpie, ent:Mat2Vec, ent:CGCNN]
    evidence:
      - {evidence_kind: DATA_QUALITATIVE, locator: "Fig. 2 bottom, ESI Fig. S1"}
  - id: paper1:LIM2
    statement_type: LIMITATION
    paper_part: RESULTS
    section: Results, Similarity of chemical elements; Fingerprint for chemical composition
    limitation_kind: METHOD
    text: Reduction to two dimensions may distort distances, and the shape of the UMAP maps depends on the UMAP parameters, although the authors state that the relative distribution of elements is robust (ESI).
  - id: paper1:CLAIM3
    statement_type: CLAIM
    paper_part: RESULTS
    section: Results, Similarity of chemical elements
    text: The two-dimensional map of Pettifor element embeddings clusters chemically similar elements together, and the clustering emerges solely from substitution patterns in crystal structures.
    about: [ent:PettEmb]
    claim_role: INTERMEDIATE
    author_certainty: DEMONSTRATED
    claim_modality: DESCRIPTIVE
    concerns:
      - {concern_type: MISSING_QUANTIFICATION, priority: MEDIUM, description: "Clustering is judged by eye; no measure such as nearest-neighbour agreement with periodic-table group is given."}
      - {concern_type: UNADDRESSED_COUNTEREVIDENCE, priority: LOW, description: "The text itself places alkali metals in the same region as non-metals (halogens, H, O), which are chemically dissimilar; this is not discussed."}
    assessment:
      validity: PARTIAL
      rationale: "Lanthanide/actinide and transition-metal grouping is described (judged from text and caption; figure unavailable), but alkalis share a region with non-metals and no quantitative clustering measure is given."
      missing_evidence:
        - Fraction of elements whose nearest neighbour in the full embedding is in the same periodic-table group, vs one-hot and Magpie

  - id: paper1:CLAIM4
    statement_type: CLAIM
    paper_part: RESULTS
    section: Results, Similarity of chemical elements
    text: Other common elemental embeddings (Magpie, Mat2Vec, Jarvis, CGCNN) give element maps of intermediate quality between the Pettifor and one-hot embeddings, with Magpie second best.
    about: [ent:Magpie, ent:Mat2Vec, ent:CGCNN]
    claim_role: INTERMEDIATE
    author_certainty: DEMONSTRATED
    claim_modality: COMPARATIVE
    concerns:
      - {concern_type: MISSING_QUANTIFICATION, priority: MEDIUM, description: "'Performance' of a map is not defined; the ranking is a visual judgement on ESI figures."}
      - {concern_type: CONFOUNDED_COMPARISON, priority: LOW, description: "The one-hot reference is equidistant by construction, so its unstructured map is a trivial baseline."}
    assessment:
      validity: WEAK
      rationale: Rests on visual comparison of maps in the ESI (not available here) without any criterion for map quality.
      missing_evidence:
        - A numeric map-quality score per embedding (e.g. group-label kNN accuracy or trustworthiness)

  - id: paper1:OBS3
    statement_type: OBSERVATION
    paper_part: RESULTS
    section: Results, Table 1
    text: "In Table 1 the three Pettifor nearest neighbours are Se (0.77), Po (0.88), Te (0.94) for S; Ge (0.64), Sn (0.96), Ga (1.04) for Si; Au (0.74), Cu (0.85), Pd (0.90) for Ag; ElMD gives Se, O, Te; Ge, B, Sn; Cu, Au, Pd; Magpie gives Ga, P, I for S and Mat2Vec gives N, O, C for S."
    about: [ent:PettEmb, ent:ElMD, ent:Magpie, ent:Mat2Vec]
    scope: {sample_count: 3, scope_note: "three query elements (S, Si, Ag)"}
    evidence:
      - evidence_kind: DATA_QUANTITATIVE
        locator: Table 1
        values:
          - {symbol: d_SSe, quantity: Pettifor distance S-Se, value: 0.77}
          - {symbol: d_SO, quantity: Pettifor distance S-O, value: 1.26}
          - {symbol: d_SiGe, quantity: Pettifor distance Si-Ge, value: 0.64}
          - {symbol: d_SiGa, quantity: Pettifor distance Si-Ga (third neighbour), value: 1.04}
        derived_checks:
          - {expression: "distance between non-negative unit vectors <= sqrt(2)", formula: "d_SO <= 2**0.5 and d_SiGa <= 2**0.5", satisfied: true}
          - {expression: "cosine similarity S-Se = 1 - d^2/2", formula: "1 - d_SSe**2/2", result: 0.70, note: "about 45 degrees, comparable to the 43 degrees quoted for K-Rb"}
          - {expression: "cosine similarity S-O = 1 - d^2/2", formula: "1 - d_SO**2/2", result: 0.21, note: "S and O are nearly orthogonal (about 78 degrees)"}
    concerns:
      - {concern_type: UNADDRESSED_COUNTEREVIDENCE, priority: LOW, description: "Po is the second most similar element to S, ahead of Te and far ahead of O; Po chemistry is sparsely represented in the ICSD, which may reflect the data bias the authors acknowledge (LIM1) rather than chemical similarity; not discussed."}
      - {concern_type: INTERNAL_INCONSISTENCY, priority: LOW, description: "Table 1 caption lists CGCNN while the text describing Table 1 omits it."}
  - id: paper1:CLAIM5
    statement_type: CLAIM
    paper_part: RESULTS
    section: Results, Similarity of chemical elements
