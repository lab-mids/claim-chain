# Showcase (retracted paper): Singh et al. 2023, E3S Web of Conferences 430, 01111 (ICMPC 2023).
# The PDF in showcase_examples/ carries a RETRACTED watermark. Annotated by Claude from that PDF
# (schema v0.6), with the same rules as the well-regarded showcase paper. Only the paper's internal
# logic is assessed: nothing was looked up, and the retraction notice was not used.
# The mismatch between in-text citations and the reference list is recorded as a concern because it
# can be seen inside the paper itself; it is attached to background statements and does not change
# any verdict.
