  title: Characterization of Microstructure and Mechanical Properties of Cast Materials using Advanced Techniques
  authors: [Bharat Singh, C Praveen Kumar, Ravi Kalra, Koushal Dhamija, Zahraa N. Salman, Manish Kumar]
  year: 2023
  doi: 10.1051/e3sconf/202343001111

