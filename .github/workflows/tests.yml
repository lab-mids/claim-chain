name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # A regular (non-editable) install, so the tests also check that the wheel ships the schema and example.
      - name: Install
        run: pip install ".[test]"
      - name: Check the CLI entry point
        run: claimchain --version
      # The tests use a fake client and make no API calls; no secrets are needed.
      - name: Run tests
        run: pytest -v
