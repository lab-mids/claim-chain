name: Build and publish Jupyter Book

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/render.py'
      - 'schema/claim_chain.yaml'
      - 'examples/**'
      - 'test_papers/yaml/**'
      - '.github/workflows/publish-book.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/render.py'
      - 'schema/claim_chain.yaml'
      - 'examples/**'
      - 'test_papers/yaml/**'
      - '.github/workflows/publish-book.yml'
  workflow_dispatch:

jobs:
  book:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install
        run: pip install -r docs/requirements.txt
      # The notebooks only read encodings from the repository; no API key is needed.
      # -W turns warnings (broken links, failed notebooks) into errors.
      - name: Build the book
        run: jupyter-book build docs/ -W --keep-going
      # Pull requests only check that the book builds.
      - name: Publish to GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html
