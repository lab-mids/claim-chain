statements:

  # ---------------- Introduction ----------------
  - id: delmont2026:BG1
    statement_type: BACKGROUND
    section: p. 1
    paper_part: INTRODUCTION
    text: Cubic boron arsenide has a room-temperature thermal conductivity of 1300-1500 W/mK or higher.
    evidence: [{evidence_kind: CITATION, references: ["3", "4", "5", "6"]}]
    about: [ent:cBAs]
  - id: delmont2026:BG2
    statement_type: BACKGROUND
    section: p. 1
    paper_part: INTRODUCTION
    text: The acoustic stiffness and lattice properties of c-BAs closely match GaAs and GaN, which reduces thermal expansion mismatch and interfacial thermal resistance compared with diamond.
    evidence: [{evidence_kind: CITATION, references: ["7"]}]
    about: [ent:cBAs]
  - id: delmont2026:BG3
    statement_type: BACKGROUND
    section: p. 1
    paper_part: INTRODUCTION
    text: Cubic BAs has high ambipolar carrier mobility and long photocarrier lifetimes.
    evidence: [{evidence_kind: CITATION, references: ["8", "9"]}]
    about: [ent:cBAs]
  - id: delmont2026:BG4
    statement_type: BACKGROUND
    section: p. 1
    paper_part: INTRODUCTION
    text: Bulk c-BAs crystals are limited to about 1 mm with non-uniform quality, which rules out wafer-scale integration.
    evidence: [{evidence_kind: CITATION, references: ["12", "13", "14"]}]
    about: [ent:cBAs]
  - id: delmont2026:BG5
    statement_type: BACKGROUND
    section: p. 1, p. 3
    paper_part: INTRODUCTION
    text: Previous c-BAs thin-film attempts yielded mainly amorphous films, possibly with thin epitaxial layers or boron subarsenide, and lost arsenic at elevated growth temperatures.
    evidence: [{evidence_kind: CITATION, references: ["17", "18"]}]
    about: [ent:cBAs, ent:BSubarsenide]
  - id: delmont2026:BG6
    statement_type: BACKGROUND
    section: p. 3
    paper_part: INTRODUCTION
    text: Single-crystal growth shows a thermodynamic preference for boron subarsenide at higher temperatures.
    evidence: [{evidence_kind: CITATION, references: ["21"]}]
    about: [ent:BSubarsenide]
  - id: delmont2026:BG7
    statement_type: BACKGROUND
    section: p. 4
    paper_part: INTRODUCTION
    text: Initial three-dimensional island nucleation followed by lateral coalescence defines Volmer-Weber growth, and large interfacial strain energy suppresses Frank-van der Merwe layer-by-layer growth.
    evidence: [{evidence_kind: CITATION, references: ["29", "30"]}]
    about: [ent:VolmerWeber]
  - id: delmont2026:GAP1
    statement_type: GAP
    section: p. 1
    paper_part: INTRODUCTION
    text: Thin-film epitaxy of c-BAs lacks lattice-matched substrates; GaAs(100) has a lattice mismatch of over 15 % with c-BAs, and crystalline c-BAs films have not been synthesized directly on such mismatched substrates.
    evidence:
      - evidence_kind: DATA_QUANTITATIVE
        locator: p. 1, p. 4
        description: Lattice parameters quoted by the paper; mismatch recomputed relative to the substrate.
        values:
          - {symbol: a_BAs, quantity: lattice parameter c-BAs, value: 4.777, unit: Å}
          - {symbol: a_GaAs, quantity: lattice parameter GaAs, value: 5.653, unit: Å}
        derived_checks:
          - {expression: mismatch (a_GaAs - a_BAs)/a_GaAs, formula: "100*(a_GaAs - a_BAs)/a_GaAs", result: 15.5, unit: '%'}
          - {expression: mismatch relative to film lattice (a_GaAs - a_BAs)/a_BAs, formula: "100*(a_GaAs - a_BAs)/a_BAs", result: 18.34, unit: '%', note: "Annotator addition: the misfit felt by the film is about 18 %."}
    about: [ent:cBAs, ent:GaAs100, ent:Mismatch]
    concerns:
      - {concern_type: INTERNAL_INCONSISTENCY, description: "The introduction calls the mismatch tensile (correct for a film with the smaller lattice), while Sec. on GIXRD (p. 5) calls it a 15.5 % compressive mismatch."}

  - id: delmont2026:HYP1
    statement_type: HYPOTHESIS
    claim_role: MAIN_CONCLUSION
    author_certainty: DEMONSTRATED
    section: Title, abstract, p. 1
    paper_part: INTRODUCTION
    text: Gas source molecular beam epitaxy can directly synthesize nanocrystalline cubic BAs thin films on lattice-mismatched GaAs(100) substrates.
    about: [ent:cBAs, ent:GaAs100, ent:GSMBE]
    claim_modality: DESCRIPTIVE
    scope: {materials: [ent:cBAs, ent:GaAs100], techniques: [ent:GSMBE, ent:XPS, ent:GIXRD, ent:HAADF], sample_count: 1, scope_note: "Structure characterized on one film (300 to 360 C); other growth temperatures only by XPS and optical microscopy."}
    assessment:
      validity: PARTIAL
      rationale: "A continuous, Ga-free B-As film with one oriented diffraction peak at the c-BAs(220) position is shown, but the phase rests on a single reflection, the film is boron-rich (calibrated B/As about 2 at the growth temperature) and grain size is never measured, so 'nanocrystalline c-BAs' is only partly established."
      missing_evidence:
        - "Raman spectrum of the film (c-BAs optical phonon) to confirm the phase"
        - "Second, independent c-BAs reflection (e.g. (111) or (400)) or a pole figure"
        - "Lattice-resolved TEM with FFT indexing inside the film, and crystallite size from TEM or XRD peak width"
        - "Depth-resolved composition (e.g. EELS quantification or RBS) giving B/As in the film bulk"
        - "A second film grown under the same conditions"
      proof_obligations:
        - text: Show that the film is the cubic zinc-blende BAs phase and not boron subarsenide or amorphous boron with some crystalline BAs.
          obligation_status: PARTIALLY_DISCHARGED
          discharged_by: [delmont2026:CLAIM1]
          priority: CRITICAL
          requested_data:
            - {quantity: Raman shift of the c-BAs optical phonon, unit: cm^-1, method: Raman spectroscopy}
            - {quantity: positions of at least two independent c-BAs reflections, unit: deg 2theta, method: GIXRD or pole figure}
        - text: Show that the film is nanocrystalline (grain size in the nanometre range).
          obligation_status: PARTIALLY_DISCHARGED
          discharged_by: [delmont2026:CLAIM2]
          priority: HIGH
          requested_data:
            - {quantity: grain size distribution, unit: nm, method: lattice-resolved TEM or plan-view TEM}
        - text: Show near-stoichiometric composition of the film bulk.
          obligation_status: OPEN
          discharged_by: []
          priority: CRITICAL
          requested_data:
            - {quantity: B/As atomic ratio of the film bulk, method: "RBS, NRA or quantitative EELS"}
        - text: Show the result is reproducible on more than one film.
          obligation_status: OPEN
          discharged_by: []
          priority: MEDIUM

  - id: delmont2026:CLAIM13
    statement_type: CLAIM
    claim_role: METHODOLOGICAL
    author_certainty: DEMONSTRATED
    section: p. 1
    paper_part: INTRODUCTION
    text: Low-temperature seed initiation followed by temperature ramping promotes 3D island coalescence and provides a route to integrating c-BAs films.
    about: [ent:GSMBE, ent:VolmerWeber]
    claim_modality: CAUSAL
    evidence:
      - {evidence_kind: ARGUMENT, description: "Stated in the introduction; only the ramped film (300 to 360 C) is characterized."}
    concerns:
      - {concern_type: CAUSAL_OVERREACH, description: "No film grown at constant temperature is characterized structurally, so the role of the ramp in coalescence is not tested."}
    assessment:
      validity: INCONCLUSIVE
      rationale: No constant-temperature control and no comparison of coalescence with and without ramping are presented.
      missing_evidence:
        - "Constant-temperature growth at 300 C and at 360 C with the same AFM, TEM and GIXRD characterization"

  # ---------------- Methods ----------------
  - id: delmont2026:METH1
    statement_type: METHOD
    section: p. 1-2
    paper_part: METHODS
    text: c-BAs films were grown on GaAs(100) after oxide desorption and a GaAs buffer, in a UHV chemical beam epitaxy system from elemental boron and cracked AsH3 (As2), with an As:B atomic flux ratio of 130:1 at a nominal rate of about 9 nm/h, starting at 300 C and ramping to 360 C for the film analysed in detail.
    about: [ent:GSMBE, ent:Film300_360]
    evidence:
      - evidence_kind: DATA_QUANTITATIVE
        locator: p. 2, Fig. S1
        values:
          - {symbol: rate, quantity: nominal growth rate, value: 9, unit: nm/h}
          - {symbol: t_growth, quantity: growth time of detailed film, value: 2, unit: h}
          - {symbol: flux_ratio, quantity: As to B atomic flux ratio, value: 130}
        derived_checks:
          - {expression: nominal thickness = rate x time, formula: rate*t_growth, result: 18, unit: nm, note: "Consistent with XRR (16 nm + 2 nm oxide) and TEM (15-20 nm)."}
  - id: delmont2026:METH2
    statement_type: METHOD
    section: p. 2
    paper_part: METHODS
    text: Composition was measured by XPS (Al K-alpha) and calibrated against a c-BAs single crystal; surface carbon and oxide were removed by 2 keV argon sputtering for up to 10 s at a rate calibrated on tantalum oxide.
    about: [ent:XPS, ent:BAsRatio]
    evidence:
      - evidence_kind: DATA_QUANTITATIVE
        values:
          - {symbol: sput_rate, quantity: sputter rate on Ta oxide, value: 0.4, unit: nm/s}
          - {symbol: sput_t, quantity: maximum sputter time, value: 10, unit: s}
        derived_checks:
          - {expression: maximum removed depth, formula: sput_rate*sput_t, result: 4, unit: nm}
    concerns:
      - {concern_type: REPRODUCIBILITY, description: "The calibration procedure against the single crystal (sensitivity factors, which crystal state, etched or unetched) is not described."}
  - id: delmont2026:METH3
    statement_type: METHOD
    section: p. 2
    paper_part: METHODS
    text: Surface morphology was measured by tapping-mode AFM and in-situ RHEED (11 kV), and structure by coplanar GIXRD with Cu K-alpha radiation, azimuthal and chi scans, and XRR.
    about: [ent:AFM, ent:RHEED, ent:GIXRD, ent:XRR]
  - id: delmont2026:METH4
    statement_type: METHOD
    section: p. 2
    paper_part: METHODS
    text: Cross-sections prepared by focused ion beam were imaged by HAADF-STEM at 300 kV with EELS and at 200 kV with EDS.
    about: [ent:HAADF, ent:EELS, ent:EDS]
  - id: delmont2026:DATA1
    statement_type: DATA
    section: Fig. 1(a)
    paper_part: METHODS
    text: About fourteen films grown between about 260 C and 630 C were measured by XPS to map composition against growth temperature.
    scope: {materials: [ent:cBAs], techniques: [ent:XPS], sample_count: 14, scope_note: "Count read from the data points in Fig. 1(a); one XPS measurement per film, error bars shown but their origin not stated."}
  - id: delmont2026:DATA2
    statement_type: DATA
    section: p. 4
    paper_part: METHODS
    text: All structural characterization (AFM, RHEED, GIXRD, XRR, TEM, EELS) is reported for a single film grown at 300 C ramped to 360 C.
    about: [ent:Film300_360]
    scope: {materials: [ent:cBAs], sample_count: 1}
  - id: delmont2026:A1
    statement_type: ASSUMPTION
    section: p. 2-3
    paper_part: METHODS
    text: The single-crystal calibration of XPS B/As ratios transfers to the thin films despite differences in topography, oxidation and sputtering response.
    assumption_basis: AUTHOR_CHOICE
    open_question: If the calibration already removes artefacts shared with the crystal, the residual excess boron of the films is real; if not, the calibrated scale is undefined.
    about: [ent:XPS, ent:BAsRatio]
  - id: delmont2026:A2
    statement_type: ASSUMPTION
    section: p. 4
    paper_part: RESULTS
    text: The diffraction peak near 54.15-54.27 deg 2theta seen below the GaAs critical angle is the c-BAs(220) reflection.
    assumption_basis: AUTHOR_CHOICE
    open_question: A single reflection 0.3-0.5 deg from the GaAs(311) peak cannot by itself exclude other B-As phases or substrate-related scattering.
    note: Implicit in the paper; formulated by the annotator.
    about: [ent:GIXRD, ent:cBAs]
  - id: delmont2026:A3
    statement_type: ASSUMPTION
    section: p. 5
    paper_part: RESULTS
    text: The TEM cross-sections taken in the coalesced regions between islands represent the structure and composition of the whole film, including the islands up to 70 nm high.
    assumption_basis: AUTHOR_CHOICE
    open_question: The islands, which hold much of the deposited material, are never sectioned, so their crystallinity and composition are unknown.
    note: Implicit in the paper; formulated by the annotator.
    about: [ent:HAADF]

  # ---------------- Results: XPS composition and growth window ----------------
  - id: delmont2026:OBS1
    statement_type: OBSERVATION
    section: Fig. 1(a), p. 3
    paper_part: RESULTS
    text: The calibrated XPS B/As ratio rises from about 1.25-1.75 near 265 C to about 2.0-2.4 at 300-390 C, then steps to about 2.5-3.3 at 410-430 C and reaches about 3.6-4.3 at 630 C; no film in the series reaches 1.0.
    about: [ent:BAsRatio, ent:GrowthWindow]
    claim_modality: DESCRIPTIVE
    evidence:
      - evidence_kind: DATA_QUANTITATIVE
        locator: Fig. 1(a)
        description: Values read from the plotted points by the annotator (about +/-0.1); "ox" = oxide removed by sputtering and peak fitting.
        values:
          - {symbol: r265_ox, quantity: calibrated B/As oxide removed, value: 1.45, condition: "about 265 C, read from Fig. 1(a)"}
          - {symbol: r270_ox, quantity: calibrated B/As oxide removed, value: 1.25, condition: "about 270 C, read from Fig. 1(a)"}
          - {symbol: r335_ox, quantity: calibrated B/As oxide removed, value: 2.05, condition: "about 335 C, read from Fig. 1(a)"}
          - {symbol: r358_ox, quantity: calibrated B/As oxide removed, value: 2.15, condition: "about 358 C, read from Fig. 1(a)"}
          - {symbol: r358_orig, quantity: calibrated B/As as measured, value: 2.4, condition: "about 358 C, read from Fig. 1(a)"}
          - {symbol: r385_ox, quantity: calibrated B/As oxide removed, value: 1.85, condition: "about 385 C, read from Fig. 1(a)"}
          - {symbol: r412_ox, quantity: calibrated B/As oxide removed, value: 2.5, condition: "about 412 C, read from Fig. 1(a)"}
          - {symbol: r630_ox, quantity: calibrated B/As oxide removed, value: 3.6, condition: "about 630 C, read from Fig. 1(a)"}
          - {symbol: fit1_lo, quantity: low-T linear fit value, value: 1.75, condition: "260 C, read from Fig. 1(a)"}
          - {symbol: fit1_hi, quantity: low-T linear fit value, value: 2.4, condition: "390 C, read from Fig. 1(a)"}
          - {symbol: fit2_lo, quantity: high-T linear fit value, value: 2.95, condition: "410 C, read from Fig. 1(a)"}
          - {symbol: fit2_hi, quantity: high-T linear fit value, value: 4.0, condition: "650 C, read from Fig. 1(a)"}
        derived_checks:
          - {expression: slope of the 250-390 C fit, formula: "(fit1_hi - fit1_lo)/(390 - 260)", result: 0.0050, unit: 1/K}
          - {expression: slope of the 410-650 C fit, formula: "(fit2_hi - fit2_lo)/(650 - 410)", result: 0.0044, unit: 1/K, note: "Same slope as below 400 C within reading error: the 'sharp transition' is a step of about 0.5, not a change of slope."}
          - {expression: step between the two fits at 400 C, formula: "fit2_lo - fit1_hi", result: 0.55}
          - {expression: As atomic fraction at the detailed film's temperature (oxide removed), formula: "1/(1 + r358_ox)", result: 0.317, note: "Stoichiometric BAs is 0.5."}
          - {expression: near-stoichiometry (B/As within 20 % of 1) at 358 C, formula: "r358_ox < 1.2", satisfied: false}
    scope: {materials: [ent:cBAs], techniques: [ent:XPS], sample_count: 14}
  - id: delmont2026:OBS2
    statement_type: OBSERVATION
    section: Fig. S3, p. 3
    paper_part: SUPPLEMENTARY
    text: XPS on a stoichiometric c-BAs single crystal gives B/As of about 1.1 unetched and about 1.2 after 10 s argon sputtering.
    about: [ent:XPS, ent:BAsRatio]
    evidence:
      - evidence_kind: DATA_QUANTITATIVE
        locator: Fig. S3
        values:
          - {symbol: xtal_unetched, quantity: B/As single crystal unetched, value: 1.1}
          - {symbol: xtal_etched, quantity: B/As single crystal after 10 s sputter, value: 1.2}
    scope: {sample_count: 1}
  - id: delmont2026:OBS3
    statement_type: OBSERVATION
    section: Fig. 1(c,d)
    paper_part: RESULTS
    text: The As 3d peak of the film shows no arsenic oxide component, while the B 1s peak contains a boron oxide component next to the B-As/elemental B component.
    about: [ent:XPS, ent:BOxide]
    evidence: [{evidence_kind: DATA_QUALITATIVE, locator: "Fig. 1(c), 1(d)"}]
  - id: delmont2026:OBS4
    statement_type: OBSERVATION
    section: Fig. 1(b)
    paper_part: RESULTS
    text: The XPS survey spectrum of the 300-360 C film shows B and As peaks and no detectable Ga 3p or Ga 3d peaks.
    about: [ent:XPS, ent:Film300_360]
    evidence: [{evidence_kind: DATA_QUALITATIVE, locator: Fig. 1(b), description: "Ga detection limit not stated."}]
  - id: delmont2026:OBS5
    statement_type: OBSERVATION
    section: Fig. S2
    paper_part: SUPPLEMENTARY
    text: In optical micrographs the 260 C film has a wormy texture, the 360 C film is optically smooth, and the 600 C film is covered with round pits.
    about: [ent:OpticalMicroscopy]
    evidence: [{evidence_kind: DATA_QUALITATIVE, locator: Fig. S2}]
    scope: {sample_count: 3}

  - id: delmont2026:CLAIM3
    statement_type: CLAIM
    claim_role: MAIN_CONCLUSION
    author_certainty: DEMONSTRATED
    section: Abstract, p. 3, Fig. 1(a)
    paper_part: RESULTS
    text: XPS shows an optimal growth temperature window of 250-400 C in which c-BAs films keep near-stoichiometric composition and severe arsenic loss is suppressed.
    about: [ent:GrowthWindow, ent:BAsRatio]
    claim_modality: DESCRIPTIVE
    concerns:
      - {concern_type: INTERNAL_INCONSISTENCY, description: "Fig. 1(a) shows calibrated B/As of about 1.8-2.4 (as measured) and 1.75-2.15 (oxide removed) at 300-390 C, i.e. an As fraction of about 0.32 instead of 0.5; the text's 'decreases to about 1.2' and the caption's 'approaches the ideal stoichiometry' hold only for the lowest-temperature point near 270 C."}
      - {concern_type: OVERCLAIM, description: "'Optimal' is judged on XPS composition alone; crystallinity, morphology and orientation are characterized for one temperature only, and the 260 C film has a wormy, low-mobility texture (Fig. S2)."}
      - {concern_type: INTERNAL_INCONSISTENCY, description: "The text calls the 250-400 C range a 'relatively flat plateau' with a small slope followed by a sharp transition, but the two fits in Fig. 1(a) have the same slope (about 0.005 per K); only a step of about 0.5 separates them."}
    assessment:
      validity: "NO"
      rationale: "The paper's own calibrated XPS data put the films in the window at B/As 1.25-2.4, about 2 at the detailed film's growth temperature, which contradicts 'near stoichiometry'; only the reduced As loss below about 400 C relative to above is supported."
      missing_evidence:
        - "Bulk-sensitive composition (RBS or quantitative EELS) for films across the window"
        - "Structural characterization (GIXRD, TEM) of films at several temperatures in and outside the window"
      proof_obligations:
        - text: Show that films in the window have B/As close to 1 in the film bulk.
          obligation_status: OPEN
          discharged_by: []
          priority: CRITICAL
          requested_data:
            - {quantity: B/As atomic ratio vs growth temperature, method: "RBS or EELS quantification on cross-sections"}
        - text: Show that arsenic loss changes abruptly at about 400 C.
          obligation_status: PARTIALLY_DISCHARGED
          discharged_by: [delmont2026:CLAIM4]
          priority: MEDIUM
        - text: Show that the window is optimal for crystal quality, not only for composition.
          obligation_status: OPEN
          discharged_by: []
          priority: HIGH
          requested_data:
            - {quantity: "GIXRD peak intensity and width vs growth temperature", method: GIXRD}

  - id: delmont2026:CLAIM4
    statement_type: CLAIM
    claim_role: INTERMEDIATE
    author_certainty: DEMONSTRATED
    section: p. 3, Fig. 1(a), Fig. S2
    paper_part: RESULTS
    text: Above about 400 C the films lose arsenic rapidly, trend towards boron subarsenide, lack long-range structural order and develop rough pitted surfaces.
    about: [ent:GrowthWindow, ent:BSubarsenide]
    claim_modality: DESCRIPTIVE
    concerns:
      - {concern_type: UNTESTED_ASSERTION, description: "The lack of long-range order above 400 C and the trend to boron subarsenide are not shown by diffraction; only optical images (Fig. S2, one film at 600 C) are given."}
      - {concern_type: MISSING_QUANTIFICATION, description: "Calibrated B/As above 400 C is about 2.5-3.6, still well below B12As2 (6), so 'trending toward subarsenide' is a direction, not a phase identification."}
    assessment:
      validity: PARTIAL
      rationale: "Fig. 1(a) shows a step of about 0.5 in B/As at 400 C and pits at 600 C are visible, but loss of order and subarsenide formation are asserted without diffraction data."
      missing_evidence:
