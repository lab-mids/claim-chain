paper_assessment:
  overall_validity: PARTIAL
  summary: >-
    The paper shows a continuous, Ga-free boron-arsenic film on GaAs(100) with a chemically
    abrupt interface (EELS, EDS, XPS; CLAIM12), three-dimensional island growth (AFM, RHEED)
    and a strongly textured diffraction peak at the c-BAs(220) position; its diffraction
    geometry recomputes. The headline 'near-stoichiometric window of 250-400 C' (CLAIM3) is
    contradicted by its own Fig. 1(a), which gives calibrated B/As of about 2 at the growth
    temperature of the analysed film. Phase identity and nanocrystallinity (CLAIM1, CLAIM2)
    rest on a single reflection and columnar contrast, and Volmer-Weber growth, the single
    low-misfit tilted orientation and the integration claim are argued rather than shown
    (CLAIM7, CLAIM11, CLAIM14). This is an independent draft annotation; figure values were read
    by eye from rendered pages, and the substrate-symmetry and SK-vs-VW points rest on
    annotator background knowledge (ANNOTATOR_BACKGROUND links).
  key_limitations:
    - "Own XPS data contradict near stoichiometry: B/As about 2 at 300-390 C after oxide removal (OBS1 vs CLAIM3), and the artefact explanation double-counts the single-crystal calibration (CLAIM5, A1)."
    - "Phase identification of c-BAs rests on one GIXRD reflection, 0.12 deg off its bulk position, without Raman or lattice-resolved TEM (CLAIM1, OBS8, LIM2)."
    - "All structural evidence comes from one film, and TEM sampled only the regions between islands (DATA2, A3)."
    - "Orientation analysis: azimuthal scan does not separate film and substrate, no symmetry variants, tilt from one reflection, 'low-misfit' never computed, and the mismatch is called tensile and compressive in different places (CLAIM9, CLAIM10, CLAIM11, GAP1)."
    - "No functional (thermal or electronic) property is measured, so the integration claim is an outlook (CLAIM14, LIM3)."
  missing_evidence:
    - "Raman spectrum and additional diffraction reflections or pole figures of the film"
    - "Bulk-sensitive composition (RBS or quantitative EELS) across the growth window"
    - "Grain size from TEM or XRD broadening"
    - "Sub-nanometre-coverage RHEED/AFM to test for a wetting layer"
    - "Constant-temperature growth control for the temperature-ramp route"
    - "Film thermal conductivity (TDTR)"
  score_method: see scripts/render.py
