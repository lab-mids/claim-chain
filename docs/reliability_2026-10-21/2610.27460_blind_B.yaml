statements:
- id: delmont2026:BG1
  statement_type: BACKGROUND
  section: Intro
  paper_part: INTRODUCTION
  text: Cubic BAs has a room-temperature thermal conductivity of 1300-1500 W/mK or more, high ambipolar mobility, and acoustic and lattice properties closer to GaAs and GaN than diamond.
  evidence:
  - evidence_kind: CITATION
    references:
    - 3-9
  about:
  - ent:cBAs
- id: delmont2026:BG2
  statement_type: BACKGROUND
  section: Intro
  paper_part: INTRODUCTION
  text: Bulk c-BAs crystals are limited to ~1 mm with non-uniform quality, and c-BAs has no lattice-matched substrate (over 15 % mismatch with GaAs).
  evidence:
  - evidence_kind: CITATION
    references:
    - 12-16
  about:
  - ent:cBAs
  - ent:Mismatch
- id: delmont2026:BG3
  statement_type: BACKGROUND
  section: Intro
  paper_part: INTRODUCTION
  text: Previous c-BAs thin-film growth gave mainly amorphous films, possibly with thin epitaxial layers or boron subarsenide, with arsenic loss at elevated temperatures.
  evidence:
  - evidence_kind: CITATION
    references:
    - '17'
    - '18'
    - '21'
  about:
  - ent:B12As2
- id: delmont2026:GAP1
  statement_type: GAP
  section: Intro
  paper_part: INTRODUCTION
  text: Crystalline c-BAs thin films have not been grown directly on strongly mismatched substrates such as GaAs.
  evidence:
  - evidence_kind: ARGUMENT
- id: delmont2026:HYP1
  statement_type: HYPOTHESIS
  claim_role: MAIN_CONCLUSION
  section: Intro, Abstract
  paper_part: INTRODUCTION
  text: Low-temperature seeded gas source MBE with temperature ramping produces nanocrystalline, near-stoichiometric c-BAs films on GaAs(100) with preferential crystallographic alignment and a chemically
    sharp interface.
  about:
  - ent:cBAs
  - ent:GaAs100
  - ent:GSMBE
  claim_modality: DESCRIPTIVE
  assessment:
    validity: PARTIAL
    rationale: Interface sharpness is shown, but near-stoichiometry (B/As ~1.2-2), nanocrystallinity and alignment are only partly supported, rest on one sample, and the role of seeding plus ramping is
      never compared with other growth recipes.
    criteria:
      grounded: MET
      scope_matches: PARTLY
      inference_sound: PARTLY
      alternatives_excluded: PARTLY
      quantified: PARTLY
      consistent: PARTLY
      criteria_note: Single detailed sample; B/As of 1.2-2 in Fig. 1a sits uneasily with near-stoichiometric; phase ID rests on one reflection next to a substrate peak.
- id: delmont2026:METH1
  statement_type: METHOD
  section: Methods
  paper_part: METHODS
  text: Films are grown in a UHV chemical beam epitaxy system from elemental B and thermally cracked AsH3 on a GaAs buffer, As-rich (As:B flux 130:1), at ~9 nm/h; the detailed film starts at 300 C and is
    ramped to 360 C.
  about:
  - ent:GSMBE
- id: delmont2026:METH2
  statement_type: METHOD
  section: Methods
  paper_part: METHODS
  text: Composition is measured by XPS calibrated against a c-BAs single crystal, with Ar sputtering up to 10 s to remove surface oxide; structure by AFM, in situ RHEED, GIXRD with XRR, and cross-sectional
    HAADF-STEM with EDS and EELS.
  about:
  - ent:XPS
  - ent:AFM
  - ent:RHEED
  - ent:GIXRD
  - ent:TEM
- id: delmont2026:DATA1
  statement_type: DATA
  section: Results
  paper_part: RESULTS
  text: One film (300 -> 360 C, ~2 h) is characterized in detail; films at other growth temperatures are characterized by XPS and optical microscopy only.
  scope:
    materials:
    - ent:cBAs
    - ent:GaAs100
    sample_count: 1
    scope_note: Number of growth-temperature samples in Fig. 1a not stated; data available on request.
- id: delmont2026:OBS1
  statement_type: OBSERVATION
  section: Results, Fig. 1a
  paper_part: RESULTS
  text: The XPS B/As ratio shows a nearly flat plateau with excess boron between 250 and 400 C, approaching 1:1 near 250 C, and a sharp arsenic loss above ~400 C toward subarsenide composition.
  evidence:
  - evidence_kind: DATA_QUANTITATIVE
    locator: Fig. 1a
  about:
  - ent:BAsRatio
  - ent:Tgrowth
- id: delmont2026:OBS2
  statement_type: OBSERVATION
  section: Results, Fig. S3
  paper_part: RESULTS
  text: The same XPS procedure gives B/As of ~1.1 for a stoichiometric single crystal and ~1.2 after 10 s sputtering; after removing surface boron oxide, the film ratio drops to ~1.2.
  evidence:
  - evidence_kind: DATA_QUANTITATIVE
    locator: Fig. S3, Fig. 1a,d
    values:
    - quantity: B/As
      value: 1.1
      condition: single crystal, unetched
    - quantity: B/As
      value: 1.2
      condition: single crystal, 10 s etch
    - quantity: B/As
      value: 1.2
      condition: film after oxide removal
  about:
  - ent:BAsRatio
  - ent:XPS
- id: delmont2026:CLAIM1
  statement_type: CLAIM
  claim_role: MAIN_CONCLUSION
  section: Results, Abstract
  paper_part: RESULTS
  text: The optimal growth window for near-stoichiometric c-BAs is 250-400 C, above which severe arsenic loss drives the film toward boron subarsenide.
  about:
  - ent:Tgrowth
  - ent:BAsRatio
  - ent:B12As2
  claim_modality: DESCRIPTIVE
  concerns:
  - concern_type: MISSING_QUANTIFICATION
    description: Number of samples per temperature and error bars on B/As not given.
  assessment:
    validity: PARTIAL
    rationale: Fig. 1a shows a lower-slope regime up to ~400 C and a steeper As loss above, but the window B/As is ~1.3-2.3 (not near 1:1), there are no samples below ~250 C, and "optimal" is not backed
      by structural data across temperatures.
    criteria:
      grounded: MET
      scope_matches: PARTLY
      inference_sound: PARTLY
      alternatives_excluded: PARTLY
      quantified: PARTLY
      consistent: PARTLY
      criteria_note: XPS composition trend is real, but B/As ~2 in the window and no error bars, sample counts or sub-250 C data undercut "optimal" and "near-stoichiometric".
- id: delmont2026:LIM1
  statement_type: LIMITATION
  section: Results
  paper_part: DISCUSSION
  text: The excess boron may come from XPS artifacts, preferential As sputtering, surface boron oxide, or regions of amorphous boron within the film.
  evidence:
  - evidence_kind: CITATION
    references:
    - 22-27
  limitation_kind: INTERPRETATION
- id: delmont2026:OBS3
  statement_type: OBSERVATION
  section: Results, Fig. 1b
  paper_part: RESULTS
  text: XPS surveys of the film show only B and As with no detectable Ga, and the As 3d peak shows no arsenic oxide.
  evidence:
  - evidence_kind: DATA_QUALITATIVE
    locator: Fig. 1b,c
  about:
  - ent:XPS
- id: delmont2026:CLAIM2
  statement_type: CLAIM
  claim_role: INTERMEDIATE
  section: Results
  paper_part: RESULTS
  text: The absence of Ga in XPS confirms that the c-BAs film forms a continuous and coherent layer over the GaAs substrate.
  about:
  - ent:cBAs
  - ent:GaAs100
  claim_modality: DESCRIPTIVE
  concerns:
  - concern_type: OVERCLAIM
    description: Absence of Ga shows coverage thicker than the photoelectron escape depth, not coherence; the film is tilted ~18 degrees with 3.5 degree mosaic spread, i.e. not coherent.
  assessment:
    validity: PARTIAL
    rationale: Ga absence (with TEM) supports a continuous covering layer thicker than the photoelectron escape depth, but it cannot show coherence, and the paper's own ~18 deg tilt and 3.5 deg mosaic spread
      contradict a coherent layer.
    criteria:
      grounded: MET
      scope_matches: PARTLY
      inference_sound: NOT_MET
      alternatives_excluded: PARTLY
      quantified: NOT_APPLICABLE
      consistent: NOT_MET
      criteria_note: Absence of Ga only proves coverage; "coherent" is a non sequitur contradicted by the GIXRD tilt and mosaicity.
- id: delmont2026:OBS4
  statement_type: OBSERVATION
  section: Results, Fig. 2a,b
  paper_part: RESULTS
  text: AFM shows circular islands up to 70 nm high with 5 nm rms roughness, consistent across locations, and RHEED changes from a streak to a dot array within minutes of growth.
  evidence:
  - evidence_kind: DATA_QUANTITATIVE
    locator: Fig. 2a, Fig. S4
    values:
    - quantity: island height max
      value: 70
      unit: nm
    - quantity: rms roughness
      value: 5
      unit: nm
  - evidence_kind: DATA_QUALITATIVE
    locator: Fig. 2b
  about:
  - ent:AFM
  - ent:RHEED
- id: delmont2026:CLAIM3
  statement_type: CLAIM
  claim_role: MECHANISTIC_INTERPRETATION
  section: Results, Abstract
  paper_part: RESULTS
  text: c-BAs grows on GaAs(100) in a Volmer-Weber 3D island mode, favoured by the ~15.5 % lattice mismatch.
  evidence:
  - evidence_kind: CITATION
    references:
    - '29'
    - '30'
  about:
  - ent:VW
  - ent:Mismatch
  claim_modality: CAUSAL
  concerns:
  - concern_type: UNADDRESSED_COUNTEREVIDENCE
    description: TEM shows a continuous 15-20 nm film between islands, which fits Stranski-Krastanov (wetting layer plus islands) at least as well as Volmer-Weber; the two are not distinguished.
  - concern_type: INTERNAL_INCONSISTENCY
    description: Mismatch is called tensile in the introduction and compressive in the results; with the smaller c-BAs lattice on GaAs, the film would be in tension.
  assessment:
    validity: PARTIAL
    rationale: AFM islands and the RHEED streak-to-spot transition show 3D island growth, but Volmer-Weber is not distinguished from Stranski-Krastanov despite the continuous 15-20 nm film in TEM, and the
      mismatch causation is asserted from textbook arguments.
    criteria:
      grounded: MET
      scope_matches: PARTLY
      inference_sound: PARTLY
      alternatives_excluded: NOT_MET
      quantified: NOT_APPLICABLE
      consistent: PARTLY
      criteria_note: 3D growth is shown, VW vs SK is not; mismatch is called tensile in the intro and compressive in the results.
- id: delmont2026:OBS5
  statement_type: OBSERVATION
  section: Results, Fig. 2c
  paper_part: RESULTS
  text: Below the critical angle only a reflection at 2theta ~ 54.27 deg, indexed as c-BAs(220), appears; above it the GaAs(311) reflection at ~53.73 deg dominates.
  evidence:
  - evidence_kind: DATA_QUALITATIVE
    locator: Fig. 2c
  about:
  - ent:GIXRD
  - ent:cBAs
  concerns:
  - concern_type: MISSING_QUANTIFICATION
    description: Phase identification rests on a single reflection 0.5 deg from a substrate peak.
- id: delmont2026:OBS6
  statement_type: OBSERVATION
  section: Results, Fig. 2d, Fig. S1b
  paper_part: RESULTS
  text: The c-BAs(220) reflection appears at a scattering-vector tilt of ~26.84 deg, i.e. ~18.2 deg off the ideal (100) orientation; an azimuthal scan gives a single peak of 3.4 deg FWHM aligned with GaAs(311),
    and the out-of-plane rocking curve has 3.5 deg FWHM.
  evidence:
  - evidence_kind: DATA_QUANTITATIVE
    locator: Eq. 1, Fig. 2d, Fig. S1b
    values:
    - quantity: crystallite tilt
      value: 18.2
      unit: deg
    - quantity: azimuthal FWHM
      value: 3.4
      unit: deg
    - quantity: rocking-curve FWHM
      value: 3.5
      unit: deg
  about:
  - ent:GIXRD
- id: delmont2026:CLAIM4
  statement_type: CLAIM
  claim_role: MAIN_CONCLUSION
  section: Results, Abstract
  paper_part: RESULTS
  text: The film is highly oriented in plane and preferentially aligned with the GaAs substrate rather than randomly polycrystalline.
  about:
  - ent:cBAs
  - ent:GaAs100
  claim_modality: DESCRIPTIVE
  concerns:
  - concern_type: MISSING_QUANTIFICATION
    description: Only one azimuthal peak is reported; for a cubic film several symmetry-equivalent peaks would be expected, and the scanned range is not shown in the text.
  assessment:
    validity: PARTIAL
    rationale: The azimuthal scan shows a narrow 3.4 deg peak with no ring background, which argues against a random powder, but only one peak appears where a cubic film should give symmetry-equivalent
      ones, and a GaAs(311) contribution 0.3-0.5 deg away is not excluded.
    criteria:
      grounded: MET
      scope_matches: PARTLY
      inference_sound: PARTLY
      alternatives_excluded: PARTLY
      quantified: MET
      consistent: MET
      criteria_note: Single azimuthal peak indicates texture, but missing symmetry equivalents and possible substrate overlap leave "highly oriented and aligned" only partly shown.
- id: delmont2026:CLAIM5
  statement_type: CLAIM
  claim_role: MECHANISTIC_INTERPRETATION
  section: Results
  paper_part: RESULTS
  text: Islands nucleate in a single tilted, low-misfit orientation rather than cube-on-cube, and strain relaxation during island growth causes the ~18 deg tilt, misorientation and faceting.
  about:
  - ent:VW
  - ent:Mismatch
  claim_modality: CAUSAL
  concerns:
  - concern_type: UNTESTED_ASSERTION
    description: No misfit calculation shows that the tilted orientation is low-misfit; the strain-relaxation cause is not tested.
  - concern_type: CAUSAL_OVERREACH
    description: Mechanism inferred from a single diffraction geometry.
  assessment:
    validity: INCONCLUSIVE
    rationale: The ~18 deg value is set by the chosen grazing geometry and shows only that some crystallites diffract there; no scan tests for other orientations, no misfit calculation shows the tilt is
      low-misfit, and strain relaxation as the cause is not tested.
    criteria:
      grounded: PARTLY
      scope_matches: NOT_MET
      inference_sound: NOT_MET
      alternatives_excluded: NOT_MET
      quantified: PARTLY
      consistent: PARTLY
      criteria_note: Mechanism inferred from one diffraction geometry without misfit calculation or orientation mapping; strain sign stated inconsistently.
- id: delmont2026:OBS7
  statement_type: OBSERVATION
  section: Results, Fig. 3a, Fig. S1a
  paper_part: RESULTS
  text: Cross-sectional HAADF and EDS show a continuous ~15-20 nm BAs film under the cap with a columnar appearance near the top; XRR gives ~16 nm BAs plus ~2 nm boron oxide.
  evidence:
  - evidence_kind: DATA_QUALITATIVE
    locator: Fig. 3a
  - evidence_kind: DATA_QUANTITATIVE
    locator: Fig. S1a
    values:
    - quantity: BAs layer thickness
      value: 16
      unit: nm
      condition: XRR
    - quantity: boron oxide thickness
      value: 2
      unit: nm
      condition: XRR
  about:
  - ent:TEM
- id: delmont2026:CLAIM6
  statement_type: CLAIM
  claim_role: MAIN_CONCLUSION
  section: Results, Title
  paper_part: RESULTS
  text: The c-BAs film is nanocrystalline.
  evidence:
  - evidence_kind: CITATION
    references:
    - '32'
  about:
  - ent:cBAs
  claim_modality: DESCRIPTIVE
  concerns:
  - concern_type: MISSING_QUANTIFICATION
    description: No grain size is measured; inferred from a columnar appearance and 'possible grain boundary regions'.
  assessment:
    validity: PARTIAL
    rationale: A crystalline c-BAs reflection, a columnar contrast and possible grain boundaries in a 16 nm film make a nanocrystalline film plausible, but no grain size is measured (no Scherrer analysis
      or grain imaging) and an amorphous fraction is left open by the authors themselves.
    criteria:
      grounded: PARTLY
      scope_matches: PARTLY
      inference_sound: PARTLY
      alternatives_excluded: PARTLY
      quantified: NOT_MET
      consistent: MET
      criteria_note: Nanocrystallinity is inferred from columnar appearance via a reference, with no grain-size measurement.
- id: delmont2026:OBS8
  statement_type: OBSERVATION
  section: Results, Fig. 3b,c
  paper_part: RESULTS
  text: The EELS profile across the interface shows the Ga L signal dropping to baseline at the boundary and a constant B K signal across the ~16 nm film.
  evidence:
  - evidence_kind: DATA_QUALITATIVE
    locator: Fig. 3b,c
  about:
  - ent:TEM
- id: delmont2026:OBS9
  statement_type: OBSERVATION
  section: Results, Fig. S5
  paper_part: SUPPLEMENTARY
  text: Lower-mass crystalline pyramidal structures without Ga occur at the interface; their lattice cannot be distinguished as c-BAs or GaAs.
  evidence:
  - evidence_kind: DATA_QUALITATIVE
    locator: Fig. S5
- id: delmont2026:CLAIM7
  statement_type: CLAIM
  claim_role: MAIN_CONCLUSION
  section: Results, Abstract
  paper_part: RESULTS
  text: The c-BAs/GaAs interface is chemically sharp with no Ga interdiffusion into the film.
  about:
  - ent:cBAs
  - ent:GaAs100
  claim_modality: DESCRIPTIVE
  assessment:
    validity: 'YES'
    rationale: EELS shows Ga dropping to baseline at the boundary, with B constant across the film, and this is corroborated by EDS maps, by XPS showing no Ga, and by EDS of the interface structures (Fig.
      S5); interface width and detection limits are not quantified.
    criteria:
      grounded: MET
      scope_matches: PARTLY
      inference_sound: MET
      alternatives_excluded: NOT_APPLICABLE
      quantified: PARTLY
      consistent: MET
      criteria_note: Three independent chemical probes agree on no Ga in the film; only one sample and no interface width or detection limit.
- id: delmont2026:LIM2
  statement_type: LIMITATION
  section: Conclusion
  paper_part: CONCLUSION
  text: Device use requires further growth optimization; grain-boundary scattering and defects must be overcome to realize high thermal conductivity in c-BAs thin films.
  evidence:
  - evidence_kind: CITATION
    references:
    - '33'
  limitation_kind: SCOPE
- id: delmont2026:OUT1
  statement_type: OUTLOOK
  section: Conclusion
  paper_part: CONCLUSION
  text: With better interface engineering, stoichiometry control and microstructure, c-BAs heterostructures could serve as integrated heat spreaders and active semiconductor layers.
  note: No thermal conductivity or electronic property of the films is measured.
