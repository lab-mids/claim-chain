  claim_role: INTERMEDIATE
  section: Sec. 5, Applicability
  paper_part: CONCLUSION
  text: Y-modified Ge-Te-Se glasses are promising candidates for phase-change memory, with Se and Y expected to improve amorphous-phase stability and crystallization control.
