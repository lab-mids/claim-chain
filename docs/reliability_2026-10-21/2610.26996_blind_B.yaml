statements:
- id: agarwal2026:BG1
  statement_type: BACKGROUND
  section: Sec. 1
  paper_part: INTRODUCTION
  text: Phase-change memory relies on reversible switching of chalcogenides between amorphous and crystalline states with large electrical and optical contrast.
  evidence:
  - evidence_kind: CITATION
    references:
    - 1-5
  about:
  - ent:PCM
- id: agarwal2026:BG2
  statement_type: BACKGROUND
  section: Sec. 1
  paper_part: INTRODUCTION
  text: GeTeSe0.5 is a promising phase-change memory composition, and Se addition raises the crystallization temperature and stabilizes the amorphous phase.
  evidence:
  - evidence_kind: CITATION
    references:
    - 6-8
    - '12'
  about:
  - ent:GeTeSe
- id: agarwal2026:BG3
  statement_type: BACKGROUND
  section: Sec. 1
  paper_part: INTRODUCTION
  text: Rare-earth elements such as yttrium modify the local structure and electronic properties of chalcogenide glasses, influencing polarization, charge transport and thermal stability.
  evidence:
  - evidence_kind: CITATION
    references:
    - 12-14
  about:
  - ent:Yttrium
- id: agarwal2026:BG4
  statement_type: BACKGROUND
  section: Sec. 1, 3
  paper_part: INTRODUCTION
  text: The correlated barrier hopping (CBH) model, in which electrons hop between charged defect states D+ and D- over a Coulomb barrier, describes ac conduction in many Ge-based chalcogenide glasses;
    its signature is a frequency exponent s < 1 that decreases with increasing temperature.
  evidence:
  - evidence_kind: CITATION
    references:
    - 15-17
    - 24-26
  about:
  - ent:CBH
  - ent:s
- id: agarwal2026:GAP1
  statement_type: GAP
  section: Sec. 1
  paper_part: INTRODUCTION
  text: The influence of yttrium incorporation on dielectric relaxation and ac conduction of Ge-Te-Se alloys has received little attention.
  evidence:
  - evidence_kind: ARGUMENT
    description: No literature survey given.
  about:
  - ent:GeTeSe
  - ent:Yttrium
- id: agarwal2026:HYP1
  statement_type: HYPOTHESIS
  claim_role: MAIN_CONCLUSION
  section: Sec. 1, Abstract
  paper_part: INTRODUCTION
  text: Yttrium incorporation tailors the dielectric relaxation and ac conduction of Te(1-x)(GeSe0.5)Yx glasses, whose conduction is governed by correlated barrier hopping, making them promising phase-change
    memory materials.
  about:
  - ent:TGSY
  - ent:CBH
  - ent:PCM
  claim_modality: CAUSAL
  assessment:
    validity: PARTIAL
    rationale: The data show that eps1, eps2, sigma_ac and relaxation parameters change with Y content (one pellet per composition, Te co-varied, no Y-free reference). The CBH attribution conflicts with
      the paper's own W_m values and PCM promise rests on no phase-change measurement.
    criteria:
      grounded: PARTLY
      scope_matches: NOT_MET
      inference_sound: PARTLY
      alternatives_excluded: NOT_MET
      quantified: PARTLY
      consistent: NOT_MET
      criteria_note: Y-dependent trends are measured, but CBH is contradicted by W_m ~ kT and no PCM property is measured.
- id: agarwal2026:ASM1
  statement_type: ASSUMPTION
  section: Sec. 1, 3
  paper_part: INTRODUCTION
  text: The CBH model is adopted a priori as the conduction model because it has described other Ge-based chalcogenide glasses well.
  evidence:
  - evidence_kind: CITATION
    references:
    - 15-17
  about:
  - ent:CBH
  assumption_basis: AUTHOR_CHOICE
  open_question: Would QMT, OLPT or small-polaron models fit the s(T) and epsilon_2 data equally well?
- id: agarwal2026:METH1
  statement_type: METHOD
  section: Sec. 2
  paper_part: METHODS
  text: Te(1-x)(GeSe0.5)Yx (x = 0.05, 0.10, 0.15) is synthesized from >99.999 % elements in evacuated quartz ampoules at 1000 C for 10-12 h with rocking and quenched in ice water.
  about:
  - ent:TGSY
  - ent:MeltQuench
- id: agarwal2026:ASM2
  statement_type: ASSUMPTION
  section: Sec. 2
  paper_part: METHODS
  text: The melt-quenched alloys are amorphous (glassy) and measured below their glass transition temperature.
  evidence:
  - evidence_kind: NONE
    description: No XRD, DSC or other structural characterization reported; Tg not given.
  about:
  - ent:TGSY
  assumption_basis: AUTHOR_CHOICE
  open_question: Are the Y-containing alloys fully amorphous, or do they contain crystalline Te or Y-rich phases that would change the dielectric response?
  concerns:
  - concern_type: UNTESTED_ASSERTION
    description: Amorphous state and 'below Tg' are asserted but never verified.
- id: agarwal2026:METH2
  statement_type: METHOD
  section: Sec. 2
  paper_part: METHODS
  text: The glass is ground and cold-pressed into pellets (10 mm diameter, ~1.2 mm thick, >5 t load) for dielectric measurements.
  about:
  - ent:Pellet
- id: agarwal2026:METH3
  statement_type: METHOD
  section: Sec. 2
  paper_part: METHODS
  text: Impedance, capacitance, loss tangent and phase angle are measured with a Solartron SI 1260 from 1 Hz to 1 MHz and 302-422 K under ~1e-3 Torr; epsilon_1, epsilon_2 and sigma_ac are computed from
    standard relations.
  evidence:
  - evidence_kind: ARGUMENT
    locator: Eq. 1-3
  about:
  - ent:DielectricSpectroscopy
  - ent:eps1
  - ent:eps2
  - ent:sigmaAC
- id: agarwal2026:METH4
  statement_type: METHOD
  section: Sec. 3, 4.2, 4.3
  paper_part: THEORY
  text: The loss exponent m (epsilon_2 = A omega^m) gives W_m via the Giuntini model, the conductivity exponent s comes from Jonscher's power law, relaxation parameters come from Cole-Cole fits, and N(EF)
    from the Austin-Mott relation.
  evidence:
  - evidence_kind: CITATION
    references:
    - '2'
    - 21-23
    - '27'
    - '28'
    locator: Eq. 4-16
  about:
  - ent:Giuntini
  - ent:ColeCole
  - ent:AustinMott
  - ent:Wm
  - ent:NEF
  concerns:
  - concern_type: INTERNAL_INCONSISTENCY
    description: Cross-references to equations are wrong (Jonscher law cited as Eq. 5, activation energy as Eq. 13, epsilon_2 power law as 'relation (2)'); two equations are numbered (19) and (20).
  - concern_type: REPRODUCIBILITY
    description: Reference 23 (Jonscher law) is empty; refs 1, 2 and 33 are duplicates.
- id: agarwal2026:DATA1
  statement_type: DATA
  section: Sec. 2, 4
  paper_part: METHODS
  text: One pellet per composition (three compositions) is measured over 1 Hz - 1 MHz; tabulated Cole-Cole parameters cover 302-342 K.
  scope:
    materials:
    - ent:TGSY
    techniques:
    - ent:DielectricSpectroscopy
    sample_count: 3
    scope_note: No repeat samples, no error bars, no undoped GeTeSe0.5 reference measured. Data available on request only.
- id: agarwal2026:OBS1
  statement_type: OBSERVATION
  section: Sec. 4.1, 4.2
  paper_part: RESULTS
  text: For all three compositions, epsilon_1 and epsilon_2 decrease with increasing frequency and increase with increasing temperature.
  evidence:
  - evidence_kind: DATA_QUALITATIVE
    locator: Fig. 2, Fig. 3
  about:
  - ent:eps1
  - ent:eps2
- id: agarwal2026:CLAIM1
  statement_type: CLAIM
  claim_role: INTERMEDIATE
  section: Sec. 4.1, 4.2
  paper_part: RESULTS
  text: The dielectric dispersion in 1 Hz - 1 MHz is dominated by dipolar and space-charge polarization, with loss from carriers hopping between D+ and D- defect states.
  evidence:
  - evidence_kind: ARGUMENT
  - evidence_kind: CITATION
    references:
    - '25'
    - 29-31
    - 36-39
  about:
  - ent:eps1
  - ent:eps2
  claim_modality: CAUSAL
  concerns:
  - concern_type: CAUSAL_OVERREACH
    description: Mechanism inferred from generic frequency/temperature trends that many mechanisms (including electrode polarization) produce.
  assessment:
    validity: INCONCLUSIVE
    rationale: The decrease of eps1 and eps2 with frequency and increase with temperature is shown but is produced by many mechanisms; no analysis in the paper distinguishes dipolar/space-charge polarization
      with D+/D- hopping from electrode polarization.
    criteria:
      grounded: PARTLY
      scope_matches: PARTLY
      inference_sound: PARTLY
      alternatives_excluded: NOT_MET
      quantified: NOT_APPLICABLE
      consistent: PARTLY
      criteria_note: Generic eps(f,T) trends plus citations; electrode/interfacial polarization and other hopping models are not excluded.
- id: agarwal2026:OBS2
  statement_type: OBSERVATION
  section: Sec. 4.1, Table 1
  paper_part: RESULTS
  text: The temperature coefficient of permittivity at 1 kHz and room temperature decreases with Y content from 0.11 to 0.02 per K.
  evidence:
  - evidence_kind: DATA_QUANTITATIVE
    locator: Table 1
    values:
    - quantity: TCP
      value: 0.11
      unit: 1/K
      condition: x = 0.05
    - quantity: TCP
      value: 0.07
      unit: 1/K
      condition: x = 0.10
    - quantity: TCP
      value: 0.02
      unit: 1/K
      condition: x = 0.15
- id: agarwal2026:OBS3
  statement_type: OBSERVATION
  section: Sec. 4.2, Table 1
  paper_part: RESULTS
  text: The maximum barrier height W_m obtained from the loss exponent m decreases with Y content, from 29.32 meV (x = 0.05) to 24.15 meV (x = 0.10) and 18.09 meV (x = 0.15).
  evidence:
  - evidence_kind: DATA_QUANTITATIVE
    locator: Fig. 4, Table 1
    values:
    - quantity: W_m
      value: 29.32
      unit: meV
      condition: x = 0.05
    - quantity: W_m
      value: 24.15
      unit: meV
      condition: x = 0.10
    - quantity: W_m
      value: 18.09
      unit: meV
      condition: x = 0.15
  about:
  - ent:Wm
  concerns:
  - concern_type: INTERNAL_INCONSISTENCY
    description: W_m of 18-29 meV is comparable to kT (~26 meV at 302 K), so the stated condition W_m >> kT fails, and Eq. 14 (s = 1 - 6kT/W_m) would give negative s, contradicting OBS5 (0 < s < 1). Typical
      CBH barriers are 0.1-1 eV.
- id: agarwal2026:OBS4
  statement_type: OBSERVATION
  section: Sec. 4.3, Table 2
  paper_part: RESULTS
  text: Cole-Cole plots of all compositions are depressed semicircles; x = 0.05 shows two arcs, x = 0.10 partially overlapping arcs, and x = 0.15 a single arc, and the relaxation time decreases with temperature.
  evidence:
  - evidence_kind: DATA_QUALITATIVE
    locator: Fig. 5, Fig. 6
  - evidence_kind: DATA_QUANTITATIVE
    locator: Table 2
    values:
    - quantity: tau_0
      value: 0.00426
      unit: s
      condition: x = 0.05, 302 K
    - quantity: tau_0
      value: 0.00042
      unit: s
      condition: x = 0.05, 342 K
  about:
  - ent:ColeCole
  concerns:
  - concern_type: INTERNAL_INCONSISTENCY
    description: Table 2 lists epsilon_inf > epsilon_s for x = 0.15 at 302 K (35.5 vs 33.7) and x = 0.10 at 342 K (46.5 vs 46.4), which is unphysical for a relaxation. The distribution parameter alpha announced
      in the text is not tabulated.
- id: agarwal2026:OBS10
  statement_type: OBSERVATION
  section: Sec. 4.3, Table 1
  paper_part: RESULTS
  text: The activation energy of dielectric relaxation is reported as 5.2, 4.6 and 3.9 eV for x = 0.05, 0.10 and 0.15.
  evidence:
  - evidence_kind: DATA_QUANTITATIVE
    locator: Table 1
    values:
    - quantity: activation energy of relaxation
      value: 5.2
      unit: eV
      condition: x = 0.05
    - quantity: activation energy of relaxation
      value: 4.6
      unit: eV
      condition: x = 0.10
    - quantity: activation energy of relaxation
      value: 3.9
      unit: eV
      condition: x = 0.15
  concerns:
  - concern_type: INTERNAL_INCONSISTENCY
    description: Several eV is implausible for a relaxation whose tau drops ~10x between 302 and 342 K (that corresponds to ~0.6 eV); units or values appear wrong.
- id: agarwal2026:CLAIM2
  statement_type: CLAIM
  claim_role: INTERMEDIATE
  section: Sec. 4.3, 5
  paper_part: RESULTS
  text: The TGSY glasses show non-Debye, thermally activated dielectric relaxation with a distribution of relaxation times arising from structural disorder.
  about:
  - ent:TGSY
  - ent:ColeCole
  claim_modality: CAUSAL
  assessment:
    validity: PARTIAL
    rationale: Non-Debye (depressed arcs) and thermally activated (tau drops ~10x from 302 to 342 K) behaviour is supported by Fig. 5, 6 and Table 2. The attribution of the distribution to structural disorder
      is asserted, alpha is never reported, and the tabulated activation energies and eps_inf > eps_s entries are physically inconsistent.
    criteria:
      grounded: MET
      scope_matches: PARTLY
      inference_sound: PARTLY
      alternatives_excluded: PARTLY
      quantified: PARTLY
      consistent: PARTLY
      criteria_note: Depressed arcs and tau(T) are shown, but alpha is not tabulated, Ea of 4-5 eV is implausible, and eps_inf > eps_s in two rows.
- id: agarwal2026:CLAIM3
  statement_type: CLAIM
  claim_role: INTERMEDIATE
  section: Sec. 4.3, 5
  paper_part: RESULTS
  text: Y incorporation enhances electrical homogeneity, so the impedance response changes from separate bulk and grain-boundary/interface contributions (x = 0.05) to bulk-dominated (x = 0.15).
  about:
  - ent:Yttrium
  - ent:TGSY
  claim_modality: CAUSAL
  concerns:
  - concern_type: UNACKNOWLEDGED_CONFLICT
    description: The phase-angle analysis (OBS11) reports a single relaxation for x = 0.05 and a shoulder for x = 0.10, yet is said to agree with Cole-Cole, which shows two arcs for x = 0.05.
  - concern_type: CONFOUNDED_COMPARISON
    description: '''Grain boundaries'' in a pressed powder pellet are powder-particle interfaces; their contribution depends on pressing, not only on Y content.'
  assessment:
    validity: INCONCLUSIVE
    rationale: The Cole-Cole arc shape changes with composition, but bulk and interface resistances are not separated by fits, the phase-angle data show a single process for x = 0.05, and pellet pressing
      rather than Y could control the interface contribution.
    criteria:
      grounded: PARTLY
      scope_matches: PARTLY
      inference_sound: PARTLY
      alternatives_excluded: NOT_MET
      quantified: NOT_MET
      consistent: PARTLY
      criteria_note: Arc evolution with x is shown on one pressed pellet each; phase-angle analysis disagrees for x = 0.05 and pellet interfaces confound the Y effect.
- id: agarwal2026:OBS5
  statement_type: OBSERVATION
  section: Sec. 4.3.1
  paper_part: RESULTS
  text: sigma_ac increases with frequency following Jonscher's power law, and the exponent s stays below 1 and decreases with increasing temperature for all compositions.
  evidence:
  - evidence_kind: DATA_QUALITATIVE
    locator: Fig. 7a,b
  about:
  - ent:sigmaAC
  - ent:s
- id: agarwal2026:OBS6
  statement_type: OBSERVATION
  section: Sec. 4.3.1, Table 3
  paper_part: RESULTS
  text: N(EF) at 10 kHz from the Austin-Mott relation increases with Y content and with temperature, from 1.3e23 to 3.1e23 m^-3 at 302 K across x = 0.05-0.15.
  evidence:
  - evidence_kind: DATA_QUANTITATIVE
    locator: Table 3
    values:
    - quantity: N(EF)
      value: 1.318e+23
      unit: m^-3
      condition: x = 0.05, 302 K
    - quantity: N(EF)
      value: 2.114e+23
      unit: m^-3
      condition: x = 0.10, 302 K
    - quantity: N(EF)
      value: 3.139e+23
      unit: m^-3
      condition: x = 0.15, 302 K
  about:
  - ent:NEF
  - ent:AustinMott
  concerns:
  - concern_type: INTERNAL_INCONSISTENCY
    description: N(EF) is a material property, yet it rises ~2.4x between 302 and 342 K; the Austin-Mott relation is a tunnelling-type expression, not CBH, so it is not consistent with the adopted model.
- id: agarwal2026:OBS7
  statement_type: OBSERVATION
  section: Sec. 4.3.2
  paper_part: RESULTS
  text: sigma_ac increases with temperature with approximately linear Arrhenius plots, and the ac activation energy decreases with increasing frequency.
  evidence:
  - evidence_kind: DATA_QUALITATIVE
    locator: Fig. 8a,b
  about:
  - ent:sigmaAC
- id: agarwal2026:CLAIM4
  statement_type: CLAIM
  claim_role: MECHANISTIC_INTERPRETATION
  section: Sec. 4.3.1, 4.3.2, 5
  paper_part: RESULTS
  text: The ac conduction in TGSY glasses is governed by correlated barrier hopping between D+ and D- localized defect states.
  about:
  - ent:CBH
  - ent:TGSY
  claim_modality: CAUSAL
  concerns:
  - concern_type: UNACKNOWLEDGED_CONFLICT
    description: The reported W_m (OBS3) is too small to be consistent with the CBH formula for s; with W_m ~ kT, CBH would predict s << 0.
  - concern_type: UNTESTED_ASSERTION
    description: Competing models (QMT, OLPT, NSPT) are listed but not fitted or excluded quantitatively.
  assessment:
    validity: PARTIAL
    rationale: The temperature dependence of s and the frequency-dependent activation energy are consistent with CBH, but the paper's own barrier heights are incompatible with the CBH expression for s and
      alternative hopping models are not excluded.
    criteria:
      grounded: PARTLY
      scope_matches: PARTLY
      inference_sound: PARTLY
      alternatives_excluded: NOT_MET
      quantified: PARTLY
      consistent: NOT_MET
      criteria_note: Qualitative s<1 decreasing with T fits CBH, but the paper's W_m ~ kT gives s = 1 - 6kT/W_m < 0, and QMT/OLPT/polaron models are not fitted.
- id: agarwal2026:OBS8
  statement_type: OBSERVATION
  section: Sec. 4.3.3
  paper_part: RESULTS
  text: epsilon_1, epsilon_2 and sigma_ac all increase systematically with Y content from x = 0.05 to x = 0.15.
  evidence:
  - evidence_kind: DATA_QUALITATIVE
    locator: Fig. 9
  - evidence_kind: DATA_QUANTITATIVE
    locator: Table 2
    values:
    - quantity: epsilon_s
      value: 20.1
      condition: x = 0.05, 302 K
    - quantity: epsilon_s
      value: 27.1
      condition: x = 0.10, 302 K
    - quantity: epsilon_s
      value: 33.7
      condition: x = 0.15, 302 K
  about:
  - ent:eps1
  - ent:eps2
  - ent:sigmaAC
  - ent:Yttrium
  scope:
    sample_count: 3
- id: agarwal2026:CLAIM5
  statement_type: CLAIM
  claim_role: MAIN_CONCLUSION
  section: Sec. 4.3.3, 5
  paper_part: RESULTS
  text: Yttrium increases the density of localized states in the mobility gap, which reduces the hopping barrier and thereby raises epsilon_1, epsilon_2 and sigma_ac.
  evidence:
  - evidence_kind: ARGUMENT
    description: Lower electronegativity and larger atomic radius of Y.
  about:
  - ent:Yttrium
  - ent:NEF
  - ent:Wm
  claim_modality: CAUSAL
  concerns:
  - concern_type: CAUSAL_OVERREACH
    description: Mechanism inferred from three compositions; no structural or spectroscopic probe of defect states (e.g. optical absorption tails, XPS).
  - concern_type: CONFOUNDED_COMPARISON
    description: Te content decreases as Y increases, so Y and Te effects are not separated, and no Y-free reference is measured.
  assessment:
    validity: PARTIAL
    rationale: The monotonic increase of eps1, eps2, sigma_ac and N(EF) and the decrease of W_m with Y are reported (three compositions, single samples, no errors). That Y creates localized states which
      lower the barrier is argued from electronegativity only, with Te co-varied and N(EF) strongly temperature-dependent and W_m inconsistent with CBH.
    criteria:
      grounded: PARTLY
      scope_matches: PARTLY
      inference_sound: PARTLY
      alternatives_excluded: NOT_MET
      quantified: PARTLY
      consistent: PARTLY
      criteria_note: Increases of eps, sigma and N(EF) with x are measured, but the defect-state mechanism is not probed and Te content co-varies with Y.
- id: agarwal2026:CLAIM6
  statement_type: CLAIM
  claim_role: MECHANISTIC_INTERPRETATION
  section: Sec. 4.3.4, 4.3.5, 5
  paper_part: RESULTS
  text: The electrical response is governed predominantly by intrinsic bulk relaxation of localized carriers rather than by electrode polarization.
  about:
  - ent:TGSY
  claim_modality: CAUSAL
  concerns:
  - concern_type: UNTESTED_ASSERTION
    description: Electrode polarization is never tested; the phase-angle section itself attributes the low-frequency response to interfacial polarization.
  assessment:
    validity: 'NO'
    rationale: No electrode-variation, thickness or blocking-electrode test is made, and the paper's own impedance, Cole-Cole and phase-angle sections assign the low-frequency response to interfacial and
      electrode polarization, contradicting the statement that electrode polarization is not dominant.
    criteria:
      grounded: NOT_MET
      scope_matches: NOT_MET
      inference_sound: NOT_MET
      alternatives_excluded: NOT_MET
      quantified: NOT_APPLICABLE
      consistent: NOT_MET
      criteria_note: Electrode polarization is never tested; the paper itself attributes the low-frequency response and the second x = 0.05 arc to interfacial/electrode polarization.
- id: agarwal2026:OBS9
  statement_type: OBSERVATION
  section: Sec. 4.3.4
  paper_part: RESULTS
  text: Z' decreases with frequency and temperature, and Z'' relaxation peaks shift to higher frequency with temperature and broaden with Y content.
  evidence:
  - evidence_kind: DATA_QUALITATIVE
    locator: Fig. 10
- id: agarwal2026:OBS11
  statement_type: OBSERVATION
  section: Sec. 4.3.5
  paper_part: RESULTS
  text: Phase-angle spectra show a single broad relaxation for x = 0.05 and 0.15 and a pronounced shoulder for x = 0.10, with the minimum shifting to higher frequency as temperature rises.
  evidence:
  - evidence_kind: DATA_QUALITATIVE
    locator: Fig. 11
- id: agarwal2026:OBS12
  statement_type: OBSERVATION
  section: Sec. 4.3.6
  paper_part: RESULTS
  text: The induced polarization, computed as P = eps0 (eps_r - 1) E at E = 400 V/m, increases with temperature, decreases with frequency, is highest for x = 0.10, and shows no maximum between 302 and 422
    K.
  evidence:
  - evidence_kind: DATA_QUALITATIVE
    locator: Fig. 12
  concerns:
  - concern_type: INTERNAL_INCONSISTENCY
    description: P is a linear function of eps_r, which increases monotonically with Y (OBS8), so x = 0.15 rather than x = 0.10 should have the highest P.
- id: agarwal2026:CLAIM7
  statement_type: CLAIM
  claim_role: INTERMEDIATE
  section: Sec. 4.3.6, 5
  paper_part: RESULTS
  text: The x = 0.10 alloy shows the most pronounced relaxation and polarization, an optimum balance between structural disorder and charge transport.
  about:
  - ent:TGSY
  claim_modality: COMPARATIVE
  concerns:
  - concern_type: UNACKNOWLEDGED_CONFLICT
    description: Conflicts with OBS8 (monotonic increase of epsilon_1 and sigma_ac with Y) and with P being proportional to eps_r - 1.
  - concern_type: MISSING_QUANTIFICATION
    description: '''Balance between disorder and transport'' is not defined or measured.'
  assessment:
    validity: 'NO'
    rationale: The paper reports eps1 and sigma_ac increasing monotonically to x = 0.15 (Fig. 9, Table 2), so the polarization computed from eps_r must also be highest at x = 0.15. The x = 0.10 optimum
      and the undefined disorder-transport balance contradict the paper's own data.
    criteria:
      grounded: PARTLY
      scope_matches: NOT_MET
      inference_sound: NOT_MET
      alternatives_excluded: NOT_MET
      quantified: NOT_MET
      consistent: NOT_MET
      criteria_note: P = eps0(eps_r-1)E with eps_r rising monotonically with Y makes a P maximum at x = 0.10 impossible.
- id: agarwal2026:CLAIM8
  statement_type: CLAIM
  claim_role: MAIN_CONCLUSION
  section: Sec. 5, Abstract
  paper_part: CONCLUSION
  text: The dielectric behaviour is consistent with the Giuntini dispersion model, and the barrier heights and frequency exponents confirm CBH conduction.
  about:
  - ent:Giuntini
  - ent:CBH
  claim_modality: DESCRIPTIVE
  concerns:
  - concern_type: OVERCLAIM
    description: '''Confirm'' is stronger than the qualitative agreement shown, given the inconsistent W_m values.'
  assessment:
    validity: 'NO'
    rationale: An eps2 = A omega^m power law is fitted, but the W_m values that are said to confirm CBH violate W_m >> kT and would give negative s in the paper's CBH formula, so the paper's own numbers
      contradict the confirmation.
    criteria:
      grounded: PARTLY
      scope_matches: PARTLY
      inference_sound: NOT_MET
      alternatives_excluded: NOT_MET
      quantified: PARTLY
      consistent: NOT_MET
      criteria_note: The barrier heights cited as confirmation (18-29 meV ~ kT) are themselves inconsistent with CBH.
