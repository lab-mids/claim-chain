paper_assessment:
  overall_validity: PARTIAL
  summary: >-
    The basic measurements hold: eps1 and eps2 fall with frequency, conduction and relaxation are
    thermally activated, the impedance arcs are depressed, and eps1 and eps2 rise with Y content.
    Almost every quantitative step beyond that is contradicted by the paper's own numbers: Wm
    (18-29 meV, about kT) gives negative s in Eq. 14 and disagrees with Fig. 4 and Fig. 7b, the
    4-5 eV relaxation activation energies are 10-40 times what Table 2 and Fig. 6 imply, Fig. 8b
    contradicts the slopes of Fig. 8a, sigma_ac is not monotonic in Y (minimum at x = 0.10), and the
    claimed polarization maximum at x = 0.10 is impossible given monotonic eps_r. The bulk-versus-
    electrode conclusion conflicts with the paper's own Cole-Cole and phase-angle readings, and PCM
    suitability is not measured. This is an annotator draft: several verdicts rest on values read off
    figures (Figs. 3b, 4, 6, 7, 8, 9), Figs. 11-12 have no axes, and the electrode-polarization reading
    of the colossal permittivity is background knowledge.
  key_limitations:
    - "Fitted CBH and Arrhenius parameters (Table 1, Fig. 8b) cannot be reproduced from the paper's own data (agarwal2026:CL3, agarwal2026:CL6b, agarwal2026:CL9)."
    - "Composition trends contradict the text: sigma_ac minimum and claimed polarization maximum at x = 0.10 (agarwal2026:CL11b, agarwal2026:CL16, agarwal2026:CL12)."
    - "Pressed powder pellets with colossal low-frequency permittivity and no electrode controls; bulk dominance asserted against the paper's own interface assignments (agarwal2026:M2, agarwal2026:CL15, agarwal2026:CL5)."
    - "Amorphous state, Tg, composition and Y dissolution never verified; one pellet per composition without error bars (agarwal2026:A2, agarwal2026:DATA1)."
    - "PCM promise rests on no PCM-relevant measurement (agarwal2026:CL17, agarwal2026:LIM1)."
  missing_evidence:
    - "XRD, DSC (Tg, Tc) and EDS for each composition"
    - "Electrode and thickness variation, or bulk-glass samples, to separate electrode from bulk response"
    - "Consistent CBH fits (Wm from s(T) and m(T)) with uncertainties"
    - "Repeat samples per composition"
    - "Crystallization and switching measurements for PCM relevance"
  score_method: see scripts/render.py
