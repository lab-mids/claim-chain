statements:

  # ---------------- Introduction ----------------
  - id: agarwal2026:BG1
    statement_type: BACKGROUND
    section: Sec. 1
    paper_part: INTRODUCTION
    text: Phase-change memory relies on reversible switching between amorphous and crystalline states of chalcogenides with a large electrical and optical contrast.
    evidence: [{evidence_kind: CITATION, references: ["1-5"]}]
    about: [ent:PCM]
  - id: agarwal2026:BG2
    statement_type: BACKGROUND
    section: Sec. 1
    paper_part: INTRODUCTION
    text: GeTeSe0.5 is a candidate PCM material, and Se additions raise the crystallization temperature and stabilize the amorphous phase of Ge-Te-Se alloys.
    evidence: [{evidence_kind: CITATION, references: ["6-8", "12"]}]
    about: [ent:PCM]
  - id: agarwal2026:BG3
    statement_type: BACKGROUND
    section: Sec. 1
    paper_part: INTRODUCTION
    text: Rare-earth elements such as yttrium modify the local structure and electronic properties of chalcogenide glasses.
    evidence: [{evidence_kind: CITATION, references: ["12-14"]}]
    about: [ent:Y]
  - id: agarwal2026:BG4
    statement_type: BACKGROUND
    section: Sec. 1, Sec. 3
    paper_part: INTRODUCTION
    text: The CBH model has been applied successfully to ac conduction in many Ge-based chalcogenide glasses.
    evidence: [{evidence_kind: CITATION, references: ["15-17"]}]
    about: [ent:CBH]
  - id: agarwal2026:GAP1
    statement_type: GAP
    section: Sec. 1
    paper_part: INTRODUCTION
    text: The influence of yttrium incorporation on dielectric relaxation and ac conduction in Ge-Te-Se alloys has received little attention.
    evidence: [{evidence_kind: ARGUMENT, description: No literature survey of Y-doped Ge-Te-Se given.}]
    about: [ent:Y, ent:TGSY]
  - id: agarwal2026:HYP1
    statement_type: HYPOTHESIS
    claim_role: MAIN_CONCLUSION
    author_certainty: DEMONSTRATED
    section: Title, Abstract, Sec. 1
    paper_part: INTRODUCTION
    text: Yttrium incorporation tailors the dielectric relaxation and charge transport of amorphous Te(1-x)(GeSe0.5)Yx glasses, whose ac conduction follows the CBH mechanism, making them promising phase-change memory materials.
    about: [ent:TGSY, ent:Y, ent:CBH, ent:PCM]
    claim_modality: CAUSAL
    concerns:
      - {concern_type: OVERCLAIM, description: "Title says 'phase-change materials', but no phase change, crystallization, switching or resistance contrast is measured."}
    assessment:
      validity: PARTIAL
      rationale: "Y changes the dielectric response (eps1 and eps2 rise with x), but the CBH parameters, activation energies and the sigma_ac trend are internally inconsistent, and PCM suitability is not tested at all."
      missing_evidence:
        - "XRD and DSC of each composition to show the amorphous state and Tg"
        - "Repeat pellets per composition with error bars"
        - "Any PCM-relevant measurement (crystallization temperature, switching, resistance contrast)"
      proof_obligations:
        - text: Show that Y changes dielectric constant, loss and ac conductivity systematically
          obligation_status: PARTIALLY_DISCHARGED
          discharged_by: [agarwal2026:CL11a, agarwal2026:CL11b]
          priority: HIGH
        - text: Show that CBH quantitatively describes the ac conduction
          obligation_status: PARTIALLY_DISCHARGED
          discharged_by: [agarwal2026:CL7, agarwal2026:CL3]
          priority: HIGH
          requested_data:
            - {quantity: W_m consistent from s(T) and m(T), unit: meV, method: fit of Eq. 14 and Eq. 6 to Fig. 7b and Fig. 4}
        - text: Show that the measured response is intrinsic to the glass and not dominated by pellet interfaces or electrodes
          obligation_status: OPEN
          priority: CRITICAL
          discharged_by: []
          requested_data:
            - {quantity: permittivity vs electrode material and sample thickness, method: impedance spectroscopy}
            - {quantity: bulk glass vs pressed pellet response, method: impedance spectroscopy on polished bulk glass}
        - text: Show suitability for PCM
          obligation_status: OPEN
          priority: CRITICAL
          discharged_by: []
          requested_data:
            - {quantity: crystallization temperature and activation energy, unit: K and eV, method: DSC}
            - {quantity: amorphous/crystalline resistance contrast, method: thin-film R(T)}
  - id: agarwal2026:A1
    statement_type: ASSUMPTION
    section: Sec. 1, Sec. 3
    paper_part: INTRODUCTION
    text: The CBH model is adopted a priori as the ac conduction model for these glasses.
    assumption_basis: AUTHOR_CHOICE
    open_question: QMT, OLPT and NSPT are named but never fitted or excluded against the data.
    about: [ent:CBH]

  # ---------------- Methods / theory ----------------
  - id: agarwal2026:M1
    statement_type: METHOD
    section: Sec. 2
    paper_part: METHODS
    text: Te(1-x)(GeSe0.5)Yx alloys were melted in evacuated quartz ampoules at 1000 C for 10-12 h with rocking and quenched in ice water.
    about: [ent:TGSY, ent:MeltQuench]
  - id: agarwal2026:M2
    statement_type: METHOD
    section: Sec. 2
    paper_part: METHODS
    text: Dielectric samples were cylindrical pellets (10 mm diameter, about 1.2 mm thick) cold-pressed from ground powder under more than 5 t.
    about: [ent:Pellet]
    concerns:
      - {concern_type: CONFOUNDED_COMPARISON, description: "Pressed powder pellets contain particle-particle interfaces, so 'grain-boundary' arcs and colossal low-frequency permittivity may come from sample form, not from the glass network. Electrode material is not stated."}
  - id: agarwal2026:M3
    statement_type: METHOD
    section: Sec. 2, Eqs. 1-3
    paper_part: METHODS
    text: Impedance, capacitance and loss tangent were recorded from 1 Hz to 1 MHz and 302 to 422 K in vacuum, and eps1, eps2 and sigma_ac were computed from them.
    about: [ent:IS, ent:eps1, ent:eps2, ent:sigma_ac]
    concerns:
      - {concern_type: REPRODUCIBILITY, description: "Eq. 3 is garbled (sigma = 2 pi f eps2 eps1 tan delta, eps0 missing); Eq. 16 lacks the minus sign; the Arrhenius fit is said to use Eq. 13 and Jonscher's law is called Eq. 5; Eqs. 19 and 20 are each used twice; refs 1, 2 and 33 are identical and ref 23 (Jonscher) is empty."}
      - {concern_type: INTERNAL_INCONSISTENCY, description: "Stated range 302-422 K, but figures stop at 362 K and Tables 2-3 at 342 K. Frequency axes in ln(omega) start at -2 (about 0.02 Hz), below the stated 1 Hz, and end at 14 (about 0.2 MHz), below 1 MHz. Fig. 10 caption speaks of 'films'."}
  - id: agarwal2026:DATA1
    statement_type: DATA
    section: Sec. 2
    paper_part: METHODS
    text: Three compositions (x = 0.05, 0.10, 0.15) were measured, apparently one pellet each, with no repeats or error bars reported.
    scope: {materials: [ent:TGSY], techniques: [ent:IS], sample_count: 3, scope_note: One pellet per composition as far as the paper says.}
    concerns:
      - {concern_type: MISSING_QUANTIFICATION, description: "No uncertainties on any fitted parameter (Wm, s, m, activation energies, N(E_F)) and no sample-to-sample scatter, yet composition trends are ranked."}
  - id: agarwal2026:A2
    statement_type: ASSUMPTION
    section: Sec. 2
    paper_part: METHODS
    text: The quenched Te(1-x)(GeSe0.5)Yx alloys are amorphous, single phase, of nominal composition, and measured below their glass transition temperature.
    assumption_basis: AUTHOR_CHOICE
    open_question: No XRD, DSC or EDS is shown; Y may form crystalline Y chalcogenide inclusions, and Tg is never measured although the abstract says all measurements are below it.
    about: [ent:TGSY, ent:Y]
    note: Implicit premise formulated by the annotator.
    concerns:
      - {concern_type: UNTESTED_ASSERTION, description: "Abstract asserts measurements 'below the glass transition temperature' without any Tg value."}
  - id: agarwal2026:A3
    statement_type: ASSUMPTION
    section: Sec. 3, Eqs. 6 and 14
    paper_part: THEORY
    text: The simplified CBH relations s = 1 - 6kT/Wm and m = -4kT/Wm hold only when Wm is much larger than kT.
    assumption_basis: COMMUNITY_ACCEPTED
    open_question: If Wm is comparable to kT the formulas give unphysical exponents and the extracted Wm is meaningless.
    evidence: [{evidence_kind: CITATION, references: [agarwal2026:ref26, agarwal2026:ref2]}]
    about: [ent:CBH, ent:Wm]
  - id: agarwal2026:M4
    statement_type: METHOD
    section: Sec. 3, Eq. 12
    paper_part: THEORY
    text: N(E_F) was estimated from sigma_ac at 10 kHz via the Austin-Mott relation with a phonon frequency of 10^4 Hz and a localization length of 10 Angstrom.
    about: [ent:AustinMott, ent:NEF]
    evidence:
      - evidence_kind: ARGUMENT
        description: Parameters of Eq. 12 as stated in the paper.
        values:
          - {symbol: nu_ph, quantity: phonon frequency, value: 1.0e+4, unit: Hz}
          - {symbol: f, quantity: measurement frequency for N(E_F), value: 1.0e+4, unit: Hz}
        derived_checks:
          - {expression: "ln(nu_ph / omega) > 0 (Austin-Mott requires nu_ph >> omega)", formula: "log(nu_ph/(2*3.14159*f)) > 0", satisfied: false}
    concerns:
      - {concern_type: AD_HOC_PARAMETER, description: "nu_ph = 10^4 Hz is below omega at 10 kHz, so ln(nu_ph/omega) is negative and the relation is outside its validity; the usual value is about 10^13 Hz. Possibly a typo, but Table 3 cannot be reproduced."}

  # ---------------- Results: dielectric constant and loss ----------------
  - id: agarwal2026:OBS1
    statement_type: OBSERVATION
    section: Sec. 4.1, Fig. 2
    paper_part: RESULTS
    text: eps1 of all three compositions falls steeply with frequency from about 1e5 (x = 0.05), 1.2e6 (x = 0.10) and 2.5e6 (x = 0.15) at the lowest frequency, and rises with temperature at every frequency shown.
    about: [ent:eps1]
    claim_modality: DESCRIPTIVE
    evidence:
      - evidence_kind: DATA_QUALITATIVE
        locator: Fig. 2a-b
        description: Values read off the figure by the annotator.
        values:
          - {symbol: eps1_lf_005, quantity: low-frequency eps1 x=0.05, value: 1.0e+5, condition: approx. from Fig. 2a}
          - {symbol: eps1_lf_015, quantity: low-frequency eps1 x=0.15, value: 2.5e+6, condition: approx. from Fig. 2a}
    concerns:
      - {concern_type: UNADDRESSED_COUNTEREVIDENCE, description: "Permittivities of 1e5 to 1e6 are the signature of electrode or interfacial (Maxwell-Wagner) polarization in a pressed pellet, which the paper does not address when it later claims bulk-dominated response."}
      - {concern_type: INTERNAL_INCONSISTENCY, description: "Fig. 2b and Fig. 9a give eps1 of about 2000-5000 at 5 kHz, while the Cole-Cole 'static' eps_s of Table 2 is only 20-57."}
  - id: agarwal2026:OBS2
    statement_type: OBSERVATION
    section: Sec. 4.2, Fig. 3
    paper_part: RESULTS
    text: eps2 decreases with frequency for all compositions with a shoulder near ln(omega) = 8-9; versus temperature, eps2 at 10 kHz rises monotonically but eps2 at 5 kHz peaks near 342 K and then falls.
    about: [ent:eps2]
    claim_modality: DESCRIPTIVE
    evidence:
      - {evidence_kind: DATA_QUALITATIVE, locator: Fig. 3a-b, description: "Annotator's reading of Fig. 3b: the 5 kHz curve has a maximum at about 342 K for all three compositions."}
  - id: agarwal2026:CL1
    statement_type: CLAIM
    claim_role: INTERMEDIATE
    author_certainty: DEMONSTRATED
    section: Abstract, Sec. 4.1-4.2, Sec. 5
    paper_part: RESULTS
    text: Dielectric constant and dielectric loss of the TGSY glasses decrease with increasing frequency and increase with increasing temperature at all investigated frequencies.
    about: [ent:eps1, ent:eps2, ent:TGSY]
    claim_modality: DESCRIPTIVE
    assessment:
      validity: PARTIAL
      rationale: "Fig. 2 and Fig. 3a show the frequency and temperature trends, but Fig. 3b shows eps2 at 5 kHz decreasing above about 342 K, contradicting 'for all investigated frequencies'."
      missing_evidence:
        - "Discussion of the eps2(T) maximum at 5 kHz"
  - id: agarwal2026:CL2
    statement_type: CLAIM
    claim_role: MECHANISTIC_INTERPRETATION
    author_certainty: PROPOSED
    section: Sec. 4.1-4.2
    paper_part: DISCUSSION
    text: The dielectric dispersion of the TGSY glasses is dominated by dipolar and space-charge polarization, with dipoles formed by electron hopping between D+ and D- defect centres.
    about: [ent:eps1, ent:eps2]
    claim_modality: CAUSAL
    evidence: [{evidence_kind: CITATION, references: ["25", "36-39"]}]
    concerns:
      - {concern_type: CAUSAL_OVERREACH, description: "The D+/D- picture is adopted from the literature; no measurement here separates it from Maxwell-Wagner interfacial polarization in the pellet."}
    assessment:
      validity: PARTIAL
      rationale: "The large low-frequency permittivity is consistent with space-charge polarization, but the D+/D- dipole mechanism is asserted from references, not tested."
      missing_evidence:
        - "Electrode and thickness variation to separate interfacial from bulk polarization"
  - id: agarwal2026:OBS3
    statement_type: OBSERVATION
    section: Sec. 4.1, Table 1
    paper_part: RESULTS
    text: The reported TCP at 1 kHz and room temperature is 0.11, 0.07 and 0.02 per K for x = 0.05, 0.10 and 0.15.
    about: [ent:TCP]
    evidence:
      - evidence_kind: DATA_QUANTITATIVE
        locator: Table 1, Table 2
        description: "Reported TCP and an annotator estimate from the Table 2 eps_s values between 302 and 312 K (not at 1 kHz)."
        values:
          - {symbol: TCP_005, quantity: TCP x=0.05, value: 0.11, unit: 1/K}
          - {symbol: TCP_015, quantity: TCP x=0.15, value: 0.02, unit: 1/K}
          - {symbol: es302_005, quantity: eps_s x=0.05, value: 20.1, condition: 302 K}
          - {symbol: es312_005, quantity: eps_s x=0.05, value: 26, condition: 312 K}
          - {symbol: es302_015, quantity: eps_s x=0.15, value: 33.7, condition: 302 K}
          - {symbol: es312_015, quantity: eps_s x=0.15, value: 43.8, condition: 312 K}
        derived_checks:
          - {expression: "TCP from Table 2, x=0.05", formula: "(es312_005 - es302_005)/(10*es302_005)", result: 0.0294, unit: 1/K}
          - {expression: "TCP from Table 2, x=0.15", formula: "(es312_015 - es302_015)/(10*es302_015)", result: 0.0300, unit: 1/K}
    concerns:
      - {concern_type: MISSING_QUANTIFICATION, description: "The 1 kHz eps1(T) curve is not shown, so TCP cannot be reproduced; Table 2 gives about 0.03 per K for all three compositions, not a decrease from 0.11 to 0.02. TCP of 2-11 % per K signals poor, not good, thermal stability of permittivity."}

  # ---------------- Barrier height from dielectric loss ----------------
  - id: agarwal2026:OBS4
    statement_type: OBSERVATION
    section: Sec. 4.2, Fig. 4
    paper_part: RESULTS
    text: The dielectric loss exponent m is plotted as positive, falling from 0.9, 0.8 and 0.7 at 302 K to about 0.51, 0.41 and 0.31 at 362 K for x = 0.05, 0.10 and 0.15.
    about: [ent:m_exp]
    evidence:
      - evidence_kind: DATA_QUALITATIVE
        locator: Fig. 4
        description: Values read from the figure; Wm recomputed from Eq. 6 with |m|.
        values:
          - {symbol: kT, quantity: kT at 302 K, value: 26.02, unit: meV}
          - {symbol: m_005, quantity: "|m| x=0.05", value: 0.9, condition: 302 K}
          - {symbol: m_015, quantity: "|m| x=0.15", value: 0.7, condition: 302 K}
        derived_checks:
          - {expression: "Wm = 4kT/|m| for x=0.05 at 302 K", formula: "4*kT/m_005", result: 115.6, unit: meV}
          - {expression: "Wm = 4kT/|m| for x=0.15 at 302 K", formula: "4*kT/m_015", result: 148.7, unit: meV}
    concerns:
      - {concern_type: INTERNAL_INCONSISTENCY, description: "eps2 decreases with frequency, so m in eps2 = A omega^m must be negative (as Eq. 6 states), but Fig. 4 plots it positive."}
  - id: agarwal2026:OBS5
    statement_type: OBSERVATION
    section: Table 1
    paper_part: RESULTS
    text: Table 1 reports Wm of 29.32, 24.15 and 18.09 meV and relaxation activation energies of 5.2, 4.6 and 3.9 eV for x = 0.05, 0.10 and 0.15.
    about: [ent:Wm, ent:Etau]
    evidence:
      - evidence_kind: DATA_QUANTITATIVE
        locator: Table 1
        values:
          - {symbol: kT, quantity: kT at 302 K, value: 26.02, unit: meV}
          - {symbol: Wm_005, quantity: Wm x=0.05, value: 29.32, unit: meV}
          - {symbol: Wm_015, quantity: Wm x=0.15, value: 18.09, unit: meV}
          - {symbol: Et_005, quantity: activation energy of relaxation x=0.05, value: 5200, unit: meV}
        derived_checks:
          - {expression: "Wm/kT at 302 K, x=0.05", formula: "Wm_005/kT", result: 1.13}
          - {expression: "CBH s = 1 - 6kT/Wm, x=0.05", formula: "1 - 6*kT/Wm_005", result: -4.33}
          - {expression: "CBH s = 1 - 6kT/Wm, x=0.15", formula: "1 - 6*kT/Wm_015", result: -7.63}
          - {expression: "Delta E_tau / Wm, x=0.05", formula: "Et_005/Wm_005", result: 177.4}
    concerns:
      - {concern_type: INTERNAL_INCONSISTENCY, description: "Wm is about kT, violating the Wm >> kT condition of Eq. 14; plugged into Eq. 14 it gives s between -4 and -8, while Fig. 7b shows s = 0.03-0.13. The method used to obtain Wm is never stated."}
      - {concern_type: REPRODUCIBILITY, description: "Table 1 also lists E_MN and ln sigma_oo (Meyer-Neldel rule, named in the keywords), which the text never mentions or derives."}
  - id: agarwal2026:CL3
    statement_type: CLAIM
    claim_role: QUANTITATIVE_SUPPORT
    author_certainty: DEMONSTRATED
    section: Sec. 4.2, Sec. 5
    paper_part: RESULTS
    text: Analysis of the dielectric loss with the Giuntini model yields maximum barrier heights Wm (29 to 18 meV, decreasing with Y) that confirm CBH conduction.
    about: [ent:Wm, ent:Giuntini, ent:CBH]
    claim_modality: DESCRIPTIVE
    warrant:
      rule: "In the Giuntini/CBH picture the slope m of ln eps2 vs ln omega gives Wm = -4kT/m."
      warrant_basis: CITATION
      references: [agarwal2026:ref2]
      support_strength: INTERMEDIATE
    concerns:
      - {concern_type: INTERNAL_INCONSISTENCY, description: "Fig. 4 with Eq. 6 gives Wm of about 116-149 meV at 302 K, increasing with Y, opposite to Table 1 (29-18 meV, decreasing). Fig. 7b with Eq. 14 gives about 180 meV."}
    assessment:
      validity: "NO"
      rationale: "The tabulated Wm cannot be reproduced from the paper's own m (Fig. 4) or s (Fig. 7b), has the opposite composition trend, and is so close to kT that the CBH formulas give negative exponents."
      missing_evidence:
        - "Wm from a fit of Eq. 14 to s(T) and of Eq. 6 to m(T), with uncertainties"

  # ---------------- Cole-Cole and relaxation time ----------------
  - id: agarwal2026:OBS6
    statement_type: OBSERVATION
    section: Sec. 4.3, Table 2
    paper_part: RESULTS
    text: Table 2 lists eps_s, eps_inf, tau0 and resistances from Cole-Cole fits at 302-342 K; tau0 falls from about 4.3-4.7 ms to 0.4-0.6 ms, and eps_inf exceeds eps_s for x = 0.10 at 342 K and x = 0.15 at 302 K.
    about: [ent:ColeCole, ent:Etau]
    evidence:
      - evidence_kind: DATA_QUANTITATIVE
        locator: Table 2
        values:
          - {symbol: t302, quantity: tau0 x=0.05, value: 4.26e-3, unit: s, condition: 302 K}
          - {symbol: t342, quantity: tau0 x=0.05, value: 0.42e-3, unit: s, condition: 342 K}
          - {symbol: kB, quantity: Boltzmann constant, value: 8.617e-5, unit: eV/K}
          - {symbol: es_010_342, quantity: eps_s x=0.10, value: 46.4, condition: 342 K}
          - {symbol: ei_010_342, quantity: eps_inf x=0.10, value: 46.5, condition: 342 K}
          - {symbol: es_015_302, quantity: eps_s x=0.15, value: 33.7, condition: 302 K}
          - {symbol: ei_015_302, quantity: eps_inf x=0.15, value: 35.5, condition: 302 K}
          - {symbol: Rs_015, quantity: R_s x=0.15, value: 21.5e+4, unit: ohm, condition: 302 K}
          - {symbol: R_015, quantity: R x=0.15, value: 3.2e+4, unit: ohm, condition: 302 K}
        derived_checks:
          - {expression: "Activation energy from tau0(302 K)/tau0(342 K), x=0.05", formula: "log(t302/t342)/((1/302 - 1/342)/kB)", result: 0.515, unit: eV}
          - {expression: "eps_s > eps_inf, x=0.10 at 342 K", formula: "es_010_342 > ei_010_342", satisfied: false}
          - {expression: "eps_s > eps_inf, x=0.15 at 302 K", formula: "es_015_302 > ei_015_302", satisfied: false}
          - {expression: "total R >= R_s, x=0.15 at 302 K", formula: "R_015 >= Rs_015", satisfied: false, note: "holds for x=0.05 and 0.10"}
    concerns:
      - {concern_type: INTERNAL_INCONSISTENCY, description: "eps_inf > eps_s is unphysical for a relaxation; the distribution parameter alpha is said to be in Table 2 but is missing; R for x=0.15 is 10-20 times smaller than for the others and smaller than R_s, while the Fig. 5 arcs of all three are about 1e4 ohm wide (Table 2 gives 5.4e5 ohm for x=0.05)."}
