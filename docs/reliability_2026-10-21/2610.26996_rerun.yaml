    section: Sec. 4.3.6
    paper_part: RESULTS
    text: The absence of a polarization maximum between 302 and 422 K shows that the response is governed by thermally activated relaxation rather than a ferroelectric phase transition.
    about: [ent:Pol]
    claim_modality: DESCRIPTIVE
    assessment:
