[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claimchain"
version = "0.1.0"
description = "Convert a research paper (PDF) into a claim-chain argument-chain YAML with a logic assessment."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "claim-chain team" }]
dependencies = [
    "anthropic>=2.0",
    "linkml>=1.8",
    "pyyaml>=6",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
claimchain = "claimchain.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claimchain"]

# Ship the schema and the reference example inside the package, so the
# installed CLI does not depend on a repository checkout.
[tool.hatch.build.targets.wheel.force-include]
"schema/claim_chain.yaml" = "claimchain/data/claim_chain.yaml"
"examples/wang2026_lattice_genome/wang2026_lattice_genome.yaml" = "claimchain/data/example.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
