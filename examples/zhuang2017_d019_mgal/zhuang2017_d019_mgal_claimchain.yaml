paper_assessment:
  overall_validity: PARTIAL
  summary: >-
    The computational core is sound and checkable: local dynamical and mechanical
    stability and the favourable ductility descriptors versus hcp Mg follow from the
    paper's own numbers, and every reported derived value recomputes. Both main
    conclusions go one step further than the data. Metastability needs a kinetic
    barrier that is only speculated (H1), and ductility is inferred from proxies,
    with the D0_19 > L1_2 ordering undercut by the APB energies. The electronic
    explanation (C3) depends on a DOS comparison that may not be normalised.
  key_limitations:
    - No decomposition barrier, so practical metastability is unshown.
    - Ductility only from intrinsic descriptors and empirical rules (Pugh).
    - D0_19 vs L1_2 energetics depend on the electronic-structure method.
    - DOS(E_F) compared per cell across cells of different size (to be checked).
  missing_evidence:
    - Transformation path and barrier toward Mg17Al12 + Mg
    - Dislocation-level or mechanical-test evidence of ductility
    - Per-atom DOS(E_F)
  score_method: see scripts/render.py
